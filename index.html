<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.0/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef, StrictMode } = React;

    // ============================================================
    // CONFIG
    // ============================================================
    const API_URL = "https://script.google.com/macros/s/AKfycbz7hvPX2foQcm8buIOLHjPOTnboLBuW70sAnhdBZCMfZ7M3wub_dn8VRqTDUW0sldP6jg/exec";
    const POINTS_PER_DOLLAR = 1000;
    const PTS_PER_LEVEL = 1500; // min 1500 pts required for each +1 level
    const GOOGLE_CLIENT_ID = "387422659555-oslvljaea4gosav8f7mtvkt43ns4fa6q.apps.googleusercontent.com";

    // Tier system — overall rate 0–100
    const TIER_SILVER = 55;
    const TIER_GOLD = 75;
    const TIER_PLATINUM = 85;
    const TASKS_PER_DAY_GOAL = 10;
    const DAILY_SCORE_MAX = 33.3;       // 10 tasks × 3.33
    const SCORE_PER_TASK = 3.33;        // 3.33 × tasks → daily contribution
    const TASK_HISTORY_CAP = 100;       // last 100 tasks
    const BALANCE_BONUS = 12;           // +12 if balance ≥ $1 (1000 pts)
    const MIN_BALANCE_FOR_BONUS = POINTS_PER_DOLLAR; // $1.00

    const COUNTRIES = [
      { code: "US", name: "United States" }, { code: "GB", name: "United Kingdom" },
      { code: "CA", name: "Canada" }, { code: "AU", name: "Australia" },
      { code: "DE", name: "Germany" }, { code: "FR", name: "France" },
      { code: "IT", name: "Italy" }, { code: "ES", name: "Spain" },
      { code: "NL", name: "Netherlands" }, { code: "BE", name: "Belgium" },
      { code: "AT", name: "Austria" }, { code: "CH", name: "Switzerland" },
      { code: "SE", name: "Sweden" }, { code: "NO", name: "Norway" },
      { code: "DK", name: "Denmark" }, { code: "FI", name: "Finland" },
      { code: "IE", name: "Ireland" }, { code: "PT", name: "Portugal" },
      { code: "PL", name: "Poland" }, { code: "CZ", name: "Czechia" },
      { code: "BR", name: "Brazil" }, { code: "MX", name: "Mexico" },
      { code: "JP", name: "Japan" }, { code: "KR", name: "South Korea" },
      { code: "IN", name: "India" }, { code: "SG", name: "Singapore" },
      { code: "AE", name: "United Arab Emirates" }, { code: "NZ", name: "New Zealand" },
      { code: "PH", name: "Philippines" }, { code: "ID", name: "Indonesia" },
      { code: "TH", name: "Thailand" }, { code: "VN", name: "Vietnam" },
      { code: "MY", name: "Malaysia" }, { code: "TR", name: "Türkiye" },
      { code: "ZA", name: "South Africa" }, { code: "NG", name: "Nigeria" }
    ];

    // ============================================================
    // HELPERS
    // ============================================================
    const storage = {
      get(k) { try { return localStorage.getItem(k); } catch { return null; } },
      set(k, v) { try { localStorage.setItem(k, v); } catch {} },
      remove(k) { try { localStorage.removeItem(k); } catch {} }
    };

    function ptsToUsd(pts) {
      const n = Number(pts);
      return isFinite(n) ? (n / POINTS_PER_DOLLAR).toFixed(2) : "0.00";
    }
    function usdToPts(usd) {
      const n = Number(usd);
      return isFinite(n) ? Math.round(n * POINTS_PER_DOLLAR) : 0;
    }
    /**
     * Normalize postback / log amounts to POINTS.
     * Backend sometimes sends points (50) and sometimes a decimal form (0.5).
     * Rule: if 0 < value < 1 → treat as "points / 100" so 0.5 === 50 pts.
     * Otherwise treat the number as points already.
     */
    function toPoints(amount) {
      const n = Number(amount);
      if (!isFinite(n) || n <= 0) return 0;
      if (n > 0 && n < 1) return Math.round(n * 100); // 0.5 → 50 pts
      return Math.round(n); // 50 → 50 pts
    }
    /**
     * Level system: each +1 level requires min 1500 pts.
     * Level 1: 0–1499 pts | Level 2: 1500–2999 | Level 3: 3000–4499 | …
     * Uses lifetime earned when available so cashouts don't lower level.
     */
    function calcLevel(pointsOrUser) {
      let pts = 0;
      if (pointsOrUser && typeof pointsOrUser === "object") {
        pts = toPoints(pointsOrUser.lifetimeEarned ?? pointsOrUser.totalEarned ?? pointsOrUser.balance ?? 0);
      } else {
        pts = toPoints(pointsOrUser);
      }
      return Math.max(1, Math.floor(pts / PTS_PER_LEVEL) + 1);
    }
    function ptsToNextLevel(pointsOrUser) {
      let pts = 0;
      if (pointsOrUser && typeof pointsOrUser === "object") {
        pts = toPoints(pointsOrUser.lifetimeEarned ?? pointsOrUser.totalEarned ?? pointsOrUser.balance ?? 0);
      } else {
        pts = toPoints(pointsOrUser);
      }
      const nextThreshold = calcLevel(pts) * PTS_PER_LEVEL;
      return Math.max(0, nextThreshold - pts);
    }
    function money(pts) { return "$" + ptsToUsd(toPoints(pts)); }

    function todayKey() {
      const d = new Date();
      return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    }

    /** Load / save per-user task history (last 100 task timestamps + daily counts) */
    function getTaskStore(account) {
      try {
        const raw = storage.get("buxiq_tasks_" + account);
        if (!raw) return { tasks: [], daily: {} };
        const data = JSON.parse(raw);
        return {
          tasks: Array.isArray(data.tasks) ? data.tasks.slice(-TASK_HISTORY_CAP) : [],
          daily: data.daily && typeof data.daily === "object" ? data.daily : {}
        };
      } catch {
        return { tasks: [], daily: {} };
      }
    }

    function saveTaskStore(account, store) {
      try {
        storage.set("buxiq_tasks_" + account, JSON.stringify({
          tasks: (store.tasks || []).slice(-TASK_HISTORY_CAP),
          daily: store.daily || {}
        }));
      } catch {}
    }

    /** Record one completed offer/survey */
    function recordTask(account) {
      if (!account) return;
      const store = getTaskStore(account);
      const now = Date.now();
      const day = todayKey();
      store.tasks.push(now);
      store.tasks = store.tasks.slice(-TASK_HISTORY_CAP);
      store.daily[day] = (store.daily[day] || 0) + 1;
      // Keep only last 14 days of daily counts
      const keys = Object.keys(store.daily).sort();
      if (keys.length > 14) {
        keys.slice(0, keys.length - 14).forEach(k => delete store.daily[k]);
      }
      saveTaskStore(account, store);
      return store;
    }

    /**
     * Merge previous completed tasks from activity logs into local store.
     * Counts log rows for this user (account / username).
     */
    function syncTasksFromLogs(account, username, logList) {
      if (!account || !Array.isArray(logList) || !logList.length) return getTaskStore(account);
      const store = getTaskStore(account);
      const uname = String(username || "").toLowerCase();
      const acct = String(account || "").toLowerCase();
      const mine = logList.filter(l => {
        const lu = String(l.username || "").toLowerCase();
        const la = String(l.account || l.userId || "").toLowerCase();
        return (uname && lu === uname) || (acct && (la === acct || lu === acct));
      });
      const fromLogs = mine.map(l => {
        const t = l.createdAt ? Date.parse(l.createdAt) : NaN;
        return isFinite(t) ? t : Date.now();
      });
      const merged = [...(store.tasks || []), ...fromLogs].filter(t => isFinite(t)).sort((a, b) => a - b);
      const deduped = [];
      for (let i = 0; i < merged.length; i++) {
        if (!deduped.length || merged[i] - deduped[deduped.length - 1] > 2000) deduped.push(merged[i]);
      }
      store.tasks = deduped.slice(-TASK_HISTORY_CAP);
      const dayStart = new Date();
      dayStart.setHours(0, 0, 0, 0);
      const todayCount = store.tasks.filter(t => t >= dayStart.getTime()).length;
      const day = todayKey();
      store.daily[day] = Math.max(store.daily[day] || 0, todayCount);
      store.logTaskCount = mine.length;
      store.syncedAt = Date.now();
      saveTaskStore(account, store);
      return store;
    }

    /**
     * Overall score (0–100):
     *   dailyScore = min(33.3, tasksToday * 3.33)  // 0 if nothing today
     *   historyScore = min(54.7, tasksInLast100 * 0.547)
     *   balanceBonus = +12 if balance ≥ $1
     *   overall = min(100, daily + history + balance)
     */
    function calcOverallScore(account, balancePts) {
      const store = getTaskStore(account);
      const day = todayKey();
      const tasksToday = store.daily[day] || 0;
      const tasksInLast100 = (store.tasks || []).length;

      const dailyScore = Math.min(DAILY_SCORE_MAX, Math.round(tasksToday * SCORE_PER_TASK * 10) / 10);
      // History: each of last 100 tasks adds up to ~0.547 so 100 tasks ≈ 54.7
      const historyScore = Math.min(54.7, Math.round(tasksInLast100 * 0.547 * 10) / 10);
      const balanceBonus = toPoints(balancePts) >= MIN_BALANCE_FOR_BONUS ? BALANCE_BONUS : 0;

      const overall = Math.min(100, Math.round((dailyScore + historyScore + balanceBonus) * 10) / 10);
      return {
        overall,
        dailyScore,
        historyScore,
        balanceBonus,
        tasksToday,
        tasksInLast100,
        logTaskCount: store.logTaskCount || 0,
        hasMinBalance: balanceBonus > 0
      };
    }

    function getTier(score) {
      if (score >= TIER_PLATINUM) return { id: "platinum", name: "Platinum", min: TIER_PLATINUM, color: "#e5e4e2", next: null };
      if (score >= TIER_GOLD) return { id: "gold", name: "Gold", min: TIER_GOLD, color: "#f5c542", next: { name: "Platinum", need: TIER_PLATINUM } };
      if (score >= TIER_SILVER) return { id: "silver", name: "Silver", min: TIER_SILVER, color: "#c0c0c0", next: { name: "Gold", need: TIER_GOLD } };
      return { id: "none", name: "Unranked", min: 0, color: "#6b7280", next: { name: "Silver", need: TIER_SILVER } };
    }

    function userTierInfo(user) {
      if (!user) return { score: { overall: 0 }, tier: getTier(0) };
      const score = calcOverallScore(user.account, user.balance);
      return { score, tier: getTier(score.overall) };
    }
    // Silver+ → Shop | Gold+ → cashout + promo codes | Platinum → daily $0.10
    function canAccessShop(user) {
      const id = userTierInfo(user).tier.id;
      return id === "silver" || id === "gold" || id === "platinum";
    }
    function canCashout(user) {
      const id = userTierInfo(user).tier.id;
      return id === "gold" || id === "platinum";
    }
    function canRedeemPromo(user) {
      const id = userTierInfo(user).tier.id;
      return id === "gold" || id === "platinum";
    }
    function isPlatinum(user) {
      return userTierInfo(user).tier.id === "platinum";
    }
    const PLATINUM_DAILY_USD = 0.10;

    async function apiGet(action, params = {}) {
      try {
        const qs = new URLSearchParams({ action, ...params }).toString();
        const res = await fetch(API_URL + "?" + qs);
        return await res.json();
      } catch { return { error: "Network error" }; }
    }
    async function apiPost(action, params = {}) {
      try {
        const body = new URLSearchParams({ action, ...params });
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8" },
          body: body.toString()
        });
        return await res.json();
      } catch { return { error: "Network error" }; }
    }

    let audioCtx = null;
    function playDing() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.type = "sine";
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
        osc.start(); osc.stop(audioCtx.currentTime + 0.35);
      } catch {}
    }

    function StatusBadge({ status }) {
      const s = String(status || "unsent").toLowerCase();
      if (s === "sent") return <span className="badge badge-sent">Sent</span>;
      if (s === "pending") return <span className="badge badge-pending">Pending</span>;
      if (s === "rejected" || s === "cancelled") return <span className="badge badge-unsent">Rejected</span>;
      return <span className="badge badge-unsent">Unsent</span>;
    }

      function saveUser(u, opts = {}) {
        // Track lifetime earned (never decreases) so level stays after cashouts
        const prev = userRef.current || {};
        const balance = toPoints(u.balance ?? prev.balance ?? 0);
        let lifetime = toPoints(u.lifetimeEarned ?? u.totalEarned ?? prev.lifetimeEarned ?? 0);
        if (opts.earnedPts && opts.earnedPts > 0) {
          lifetime = Math.max(lifetime, toPoints(prev.lifetimeEarned || 0) + opts.earnedPts);
          // Each completed offer/survey = 1 task toward overall score
          const acct = u.account || prev.account;
          if (acct) recordTask(acct);
        }
        // Keep lifetime at least as high as current balance (first login / legacy)
        lifetime = Math.max(lifetime, balance);
        const level = calcLevel(lifetime);
        const next = { ...prev, ...u, balance, lifetimeEarned: lifetime, level };
        setUser(next);
        userRef.current = next;
        storage.set("buxiq_user", JSON.stringify(next));
      }

      const loadBrands = useCallback(async (cc) => {
        const code = cc || country || "US";

        setProducts({ fixed: [], ranges: [] });
        setBrandPage(1);
        const res = await apiGet("getCRBrands", { country: code, country_code: code });
        setLoadingBrands(false);
        if (res.error) {
          setBrands([]);
          setBrandError(res.error);
          return;
        }
        // Normalize brands
        let raw = res.brands;
        if (!raw) raw = [];
        else if (!Array.isArray(raw)) {
          if (Array.isArray(raw.brands)) raw = raw.brands;
          else if (Array.isArray(raw.data)) raw = raw.data;
          else if (Array.isArray(raw.items)) raw = raw.items;
          else if (Array.isArray(raw.results)) raw = raw.results;
          else if (Array.isArray(raw.families)) raw = raw.families;
          else {
            const tmp = [];
            Object.keys(raw).forEach(k => {
              const v = raw[k];
              if (Array.isArray(v)) v.forEach(x => tmp.push(x));
              else if (v && typeof v === "object" && (v.name || v.brand_name)) tmp.push(v);
            });
            raw = tmp;
          }
        }
        const seen = {};
        const list = [];
        raw.forEach((b, i) => {
          if (!b || typeof b !== "object") return;
          const name = String(b.name || b.brand_name || b.family_name || b.title || b.brand || "").trim();
          if (!name || /^brand\s*\d+$/i.test(name)) return;
          const family = String(b.family_name || b.brand_name || b.name || name).trim();
          const key = family.toLowerCase();
          if (seen[key]) return;
          seen[key] = true;
          let logo = b.logo_url || b.logo || b.image || "";
          if (!logo && b.logo_base_url) logo = String(b.logo_base_url) + ".webp";
          list.push({
            id: String(b.id || b.slug || family) + "_" + i,
            name,
            family_name: family,
            brand_name: String(b.brand_name || family || name).trim(),
            logo,
            country_code: b.country_code || "",
            raw: b
          });
        });
        list.sort((a, b) => a.name.localeCompare(b.name));
        setBrands(list);
        if (!list.length) setBrandError("No brands returned.");
      }, [country]);

      const loadProducts = useCallback(async (brand) => {
        if (!user) {
          showAlert("Please login first");
          setPage("earn");
          return;
        }
        setSelectedBrand(brand);
        setProducts({ fixed: [], ranges: [] });
        setSelectedDenom(null);
        setCustomAmount("");
        if (user.email) setEmail(String(user.email));
        setLoadingProducts(true);
        const res = await apiGet("getCRProducts", {
          country,
          country_code: country,
          family_name: brand.family_name || brand.brand_name || brand.name,
          brand_name: brand.brand_name || brand.family_name || brand.name,
          coin: "USDC",
          lang: "en"
        });
        setLoadingProducts(false);
        if (res.error) {
          showAlert(res.error);
          setProducts({ fixed: [], ranges: [] });
          return;
        }
        // Normalize products
        let raw = res.products || res.data || res.items || res;
        if (!Array.isArray(raw) && typeof raw === "object") {
          if (raw.denominations || raw.face_values) raw = [raw];
          else raw = Object.values(raw).filter(x => x && typeof x === "object");
        }
        if (!Array.isArray(raw)) raw = [];
        const fixed = [];
        const ranges = [];
        const seen = {};
        function addFixed(label, value, currency) {
          const v = Number(value);
          if (!isFinite(v) || v <= 0) return;
          const key = v.toFixed(2) + "|" + (currency || "");
          if (seen[key]) return;
          seen[key] = true;
          fixed.push({
            label: label || (currency ? currency + " " + v : "$" + v),
            value: v,
            denomination: label || v + " " + (currency || "USD"),
            currency: currency || "USD"
          });
        }
        raw.forEach(p => {
          const dens = p.denominations || p.denomination_list || p.face_values || p.values || p.amounts || [];
          if (Array.isArray(dens)) {
            dens.forEach(d => {
              if (d == null) return;
              if (typeof d === "number" || typeof d === "string") {
                const v = parseFloat(String(d).replace(/[^0-9.]/g, ""));
                addFixed(String(d), v, p.currency || "USD");
              } else if (typeof d === "object") {
                const v = parseFloat(d.value || d.face_value || d.amount || d.denomination || 0);
                addFixed(d.label || d.denomination || d.localized || (d.currency ? d.currency + " " + v : null), v, d.currency || p.currency || "USD");
              }
            });
          }
          if (p.denomination && typeof p.denomination === "string" && p.denomination.toLowerCase() !== "range") {
            const v = parseFloat(String(p.denomination).replace(/[^0-9.]/g, ""));
            addFixed(p.denomination, v, p.currency || "USD");
          }
          if (p.face_value || p.value || p.amount) {
            addFixed(null, parseFloat(p.face_value || p.value || p.amount), p.currency || "USD");
          }
          const isRange = String(p.denomination || p.type || p.kind || "").toLowerCase().includes("range")
            || p.min_value != null || p.max_value != null || p.min != null || p.max != null;
          if (isRange) {
            ranges.push({
              min: Number(p.min_value || p.min || 1) || 1,
              max: Number(p.max_value || p.max || 500) || 500,
              currency: p.currency || "USD",
              brand_name: p.brand_name || brand.name
            });
          }
        });
        fixed.sort((a, b) => a.value - b.value);
        if (!fixed.length && !ranges.length) {
          setProducts({ fixed: [], ranges: [{ min: 1, max: 500, currency: "USD", brand_name: brand.name }] });
        } else {
          setProducts({ fixed, ranges });
        }
      }, [user, country]);

      // ---- Platinum daily $0.10 ----
      async function claimPlatinumDaily() {
        if (!user) { showAlert("Please login first"); return; }
        if (!isPlatinum(user)) {
          showAlert("Platinum tier required (overall ≥ 85) for the daily $0.10 code.");
          return;

        const pts = PLATINUM_DAILY_PTS;
        // Prefer server credit with fixed txn id per day

        const res = await apiPost("creditEarnings", {

          // Local fallback credit if API rejects
          showAlert(res.error);

        markPlatinumClaimed(user.account);
        const newBal = res.newBalance != null ? toPoints(res.newBalance) : toPoints(user.balance || 0) + pts;
        saveUser({ ...user, balance: newBal }, { earnedPts: pts });
        showAlert("Platinum daily reward: $0.10 (" + pts + " pts) added!", "success");

      // ---- Bonus ----
      async function redeemBonus() {
        if (!user) { showAlert("Please login first"); setPage("earn"); return; }
        if (!canRedeemPromo(user)) {
          showAlert("Gold tier required to redeem promo codes (overall ≥ 75).");
          setPage("profile");
          return;
        }
        const code = (loginForm.bonusCode || "").trim();
        if (!code) return showAlert("Please enter a bonus code");
        const res = await apiGet("redeemBonus", {
          account: user.account,
          username: user.username || user.account,
          bonusCode: code
        });
        if (res.error) showAlert(res.error);
        else {
          // Rate: $1 = 1000 pts
          // Backend may return amount in pts or amountUsd in dollars (or pts by mistake)
          let pts = 0;
          if (res.amount != null && res.amount !== "") {
            pts = toPoints(res.amount);
          } else if (res.amountUsd != null && res.amountUsd !== "") {
            const usdVal = parseFloat(res.amountUsd);
            // If amountUsd is large like 1000, backend sent points in amountUsd field
            if (isFinite(usdVal) && usdVal >= 1 && Number.isInteger(usdVal)) {
              pts = toPoints(usdVal);
            } else if (isFinite(usdVal)) {
              pts = usdToPts(usdVal);
            }
          }
          const usdStr = ptsToUsd(pts);
          showAlert("Successfully redeemed $" + usdStr + " (" + pts + " pts)!", "success");
          setLoginForm(f => ({ ...f, bonusCode: "" }));
          if (res.newBalance != null) {
            saveUser({ ...user, balance: toPoints(res.newBalance) || res.newBalance }, { earnedPts: pts });
          } else if (pts > 0) {
            const newBal = toPoints(user.balance || 0) + pts;
            saveUser({ ...user, balance: newBal }, { earnedPts: pts });
          } else {
            refreshBalance();
          }
        }
      }

      // ---- Gift card submit ----
      async function submitGiftCard() {
        if (!user) { showAlert("Please login first"); setPage("earn"); return; }
        if (!canAccessShop(user)) {
          showAlert("Silver tier required to access Shop (overall ≥ 55).");
          setPage("profile");
          return;
        }
        if (!canCashout(user)) {
          showAlert("Gold tier required to cash out (overall ≥ 75). Keep earning to unlock.");
          setPage("profile");
          return;
        }
        const em = (email || user.email || "").trim();
        if (!em || em.indexOf("@") < 0) return showAlert("Enter valid email");
        let amount = 0, denom = "";
        if (customAmount && parseFloat(customAmount) > 0) {
          amount = parseFloat(customAmount);
          denom = "range";
        } else if (selectedDenom) {
          amount = selectedDenom.value;
          denom = selectedDenom.denomination || amount + " USD";
        } else {
          return showAlert("Select or enter an amount");
        }
        if (amount <= 0) return showAlert("Invalid amount");
        const pts = usdToPts(amount);
        if (pts > Number(user.balance || 0)) return showAlert("Insufficient balance");
        setSubmitting(true);
        let ip = "";
        try {
          const r = await fetch("https://api.ipify.org?format=json");
          const j = await r.json();
          if (j && j.ip) ip = String(j.ip);
        } catch {}
        const res = await apiPost("submitCRCashout", {
          account: user.account,
          username: user.username || user.account,
          brand_name: selectedBrand.brand_name || selectedBrand.family_name || selectedBrand.name,
          country_code: country,
          amountUsd: amount.toFixed(2),
          amount: pts,
          denomination: denom,
          details: em,
          email: em,
          coin: "USDC",
          network: "Solana",
          ip,
          userAgent: navigator.userAgent || "RewardBux"
        });
        setSubmitting(false);
        if (res.error) {
          showAlert(res.error + (res.refunded ? " (balance refunded)" : ""));
          return;
        }
        showAlert("Gift card order submitted! Email: " + em, "success");
        const newBal = res.newBalance !== undefined ? res.newBalance : Number(user.balance) - pts;
        saveUser({ ...user, balance: newBal });
        loadCashouts(user.account);
        setSelectedBrand(null);
        setSelectedDenom(null);
        setCustomAmount("");
      }

      function openOfferwall(ow) {
        if (!user) { showAlert("Please login first"); setPage("earn"); return; }
        const uid = String(user.account || user.username || "");
        const uname = String(user.username || uid);
        let url = String(ow.urlTemplate || "");
        if (!url) return showAlert("Offerwall URL missing");
        url = url
          .replace(/\{user\}/gi, encodeURIComponent(uid))
          .replace(/\{userid\}/gi, encodeURIComponent(uid))
          .replace(/\{user_id\}/gi, encodeURIComponent(uid))
          .replace(/\{account\}/gi, encodeURIComponent(uid))
          .replace(/\{username\}/gi, encodeURIComponent(uname));
        url += (url.indexOf("?") !== -1 ? "&" : "?") + "t=" + Date.now();
        setIframeUrl(url);
      }

        const next = !soundOn;
        setSoundOn(next);
        soundRef.current = next;
        storage.set("buxiq_sound", next ? "1" : "0");

      function go(p) {
        if (p === "chat") {
          setChatOpen(o => !o);
          setMenuOpen(false);
          return;
        }
        // Tier gates
        if (p === "shop") {
          if (!user) { showAlert("Please login first"); setPage("earn"); setMenuOpen(false); return; }
          if (!canAccessShop(user)) {
            showAlert("Silver tier required to access Shop (overall ≥ 55). Open Profile to see your score.");
            setPage("profile");
            setMenuOpen(false);
            return;
          }
        }
        if (p === "bonus") {
          if (!user) { showAlert("Please login first"); setPage("earn"); setMenuOpen(false); return; }
          // Gold or Platinum can use promo page; others redirected
          if (!canRedeemPromo(user)) {
            showAlert("Gold tier required to redeem promo codes (overall ≥ 75).");
            setPage("profile");
            setMenuOpen(false);
            return;
          }
        }
        setChatOpen(false);
        setPage(p);
        setMenuOpen(false);
      }

      // ---- Effects ----
      useEffect(() => {
        const saved = storage.get("buxiq_user");
        if (saved) {
          try {
            const u = JSON.parse(saved);
            setUser(u);
            userRef.current = u;
          } catch {}
        }
        const s = storage.get("buxiq_sound");
        if (s !== null) {
          setSoundOn(s === "1");
          soundRef.current = s === "1";
        }
        genCaptcha();
        loadLeaders();
        loadLogs();
        loadOfferwalls();

        // Postback from offerwalls
        const params = new URLSearchParams(window.location.search);
        const uid = params.get("user_id") || params.get("userid");
        const amount = params.get("amount") || params.get("reward");
        const txn = params.get("transaction_id") || params.get("txn_id");
        if (uid && amount && !isNaN(parseFloat(amount))) {
          const pts = toPoints(amount); // 50 → 50 pts, 0.5 → 50 pts
          apiPost("creditEarnings", {
            userId: uid,
            amount: pts,
            transactionId: txn || String(Date.now())
          }).then(res => {
            if (!res.error) {
              showAlert(money(pts) + " credited!", "success");
              if (soundRef.current) playDing();
              loadLogs();
              loadLeaders();
              const u = userRef.current;
              if (u && (String(u.account) === String(uid) || u.username === uid)) {
                // Add earned pts toward level (1500 pts per level)
                const newBal = toPoints(u.balance || 0) + pts;
                saveUser({ ...u, balance: newBal }, { earnedPts: pts });
              }
            }
          });
          window.history.replaceState({}, document.title, window.location.pathname);
        }
      }, []);

      useEffect(() => { soundRef.current = soundOn; }, [soundOn]);
      useEffect(() => { userRef.current = user; }, [user]);

      // Google button
      useEffect(() => {
        if (user) return;
        let tries = 0;
        const id = setInterval(() => {
          tries++;
          const el = document.getElementById("gbtn");
          const g = window.google?.accounts?.id;
          if (g && el) {
            clearInterval(id);
            try {
              if (!googleRendered.current) {
                g.initialize({
                  client_id: GOOGLE_CLIENT_ID,
                  callback: handleGoogle,
                  cancel_on_tap_outside: true
                });
                googleRendered.current = true;
              }
              el.innerHTML = "";
              g.renderButton(el, {
                theme: "filled_blue", size: "large", width: 320,
                text: "continue_with", shape: "pill", logo_alignment: "left"
              });
            } catch {}
          } else if (tries > 40) clearInterval(id);
        }, 250);
        return () => clearInterval(id);
      }, [page, user, handleGoogle]);

      // Always poll chat so popups work even when chat is closed
      useEffect(() => {
        loadChat(true);
        const id = setInterval(() => loadChat(false), 4000);
        return () => clearInterval(id);
      }, [loadChat]);

      useEffect(() => {
        chatOpenRef.current = chatOpen;
        if (chatOpen) setChatPopup(null); // clear popup when user opens chat
      }, [chatOpen]);

      // Auto-dismiss popup after 12s (new message will show again)
      useEffect(() => {
        if (!chatPopup) return;
        const t = setTimeout(() => setChatPopup(null), 12000);
        return () => clearTimeout(t);
      }, [chatPopup]);

      useEffect(() => {
        if (page === "shop" && user) loadCashouts(user.account);
      }, [page, user, loadCashouts]);

      useEffect(() => {
        if (page === "shop" && user) loadBrands(country);
      }, [page, user, country]);

      useEffect(() => {
        if (page === "earn") loadOfferwalls();
      }, [page, loadOfferwalls]);

      // When opening profile, refresh logs → count past tasks → final score
      useEffect(() => {
        if (page === "profile" && user) {
          loadLogs().then(() => {
            // force re-render with updated store
            setUser(u => (u ? { ...u } : u));
          });
        }
      }, [page, user && user.account]);

      useEffect(() => {
        if (chatEndRef.current) chatEndRef.current.scrollIntoView({ behavior: "smooth" });
      }, [messages]);

      useEffect(() => {
        function onClick(e) {
          if (menuRef.current && !menuRef.current.contains(e.target)) setMenuOpen(false);
        }
        document.addEventListener("mousedown", onClick);
        return () => document.removeEventListener("mousedown", onClick);
      }, []);

      const NAV = [
        { id: "home", icon: "fa-home", label: "Home" },
        { id: "earn", icon: "fa-hand-holding-dollar", label: "Earn" },
        { id: "shop", icon: "fa-shopping-cart", label: "Shop" },
        { id: "leaders", icon: "fa-trophy", label: "Leaders" },
        { id: "chat", icon: "fa-comments", label: "Chat" },
        { id: "bonus", icon: "fa-gift", label: "Bonus" },
        { id: "help", icon: "fa-circle-question", label: "Help" }
      ];

      const filteredBrands = brandSearch.trim()
        ? brands.filter(b => (b.name + " " + b.family_name + " " + b.brand_name).toLowerCase().includes(brandSearch.trim().toLowerCase()))
        : brands;
      const shownBrands = filteredBrands.slice(0, 48 * brandPage);

      // ---- Render ----
      return (
        <div className="app">
          {/* Header */}
          <div className="top-header">
            <div className="header-row">
              <div className="logo" onClick={() => go("home")}>
                <img src="https://i.ibb.co/s9MLLtHD/IMG-3307.png" alt="RewardBux" />
              </div>
              <div className="header-nav">
                {NAV.map(n => (
                  <div key={n.id} className={"nav-item" + ((n.id === "chat" ? chatOpen : page === n.id) ? " active" : "")}
                    onClick={() => go(n.id)}>
                    <i className={"fas " + n.icon} /><span>{n.label}</span>
                  </div>
                ))}
              </div>
              <div className="header-user" ref={menuRef}>
                {user ? (
                  <>
                    <div className="avatar-wrap" onClick={() => go("profile")} title="Open profile">
                      <img src={user.avatar || "https://ui-avatars.com/api/?name=" + encodeURIComponent(user.username || "U") + "&background=0d9488&color=fff"} alt="" />
                      <div className="level-badge">{user.level || 1}</div>
                    </div>
                    <div className="user-meta" onClick={() => go("profile")} style={{ cursor: "pointer" }}>
                      <div className="name">{user.username || user.account || "User"}</div>
                      <div className="balance-row">
                        <span className="diamond"><i className="fas fa-gem" /></span>
                        <span className="amount">{money(user.balance || 0)}</span>
                      </div>
                    </div>
                    <button className="icon-btn logout" onClick={() => setMenuOpen(m => !m)} title="Menu"><i className="fas fa-ellipsis-v" /></button>
                    {menuOpen && (
                      <div className="dropdown-menu">
                        <button className="menu-item" onClick={() => go("profile")}><i className="fas fa-user" /> Profile & Tiers</button>
                        <button className="menu-item" onClick={() => go("history")}><i className="fas fa-clock-rotate-left" /> Cashout History</button>
                        <button className="menu-item" onClick={() => go("leaders")}><i className="fas fa-trophy" /> Leaderboard</button>
                        <button className="menu-item" onClick={() => go("bonus")}><i className="fas fa-gift" /> Bonus Codes</button>
                        <div className="menu-divider" />
                        <button className="menu-item" onClick={logout}><i className="fas fa-sign-out-alt" /> Logout</button>
                      </div>
                    )}
                  </>
                ) : (
                  <button className="btn btn-primary" style={{ width: "auto", padding: "8px 16px", fontSize: "0.8125rem" }}
                    onClick={() => setPage("earn")}>Signup / Login</button>
                )}
              </div>
            </div>
            {logs.length > 0 && (
              <div className="logs-bar">
                <div className="logs-bar-inner">
                  <div className="logs-live"><span className="dot" /> Live</div>
                  <div className="logs-track-wrap">
                    <div className="logs-row">
                      {[...logs.slice(0, 20), ...logs.slice(0, 20)].map((l, i) => (
                        <div className="log-card" key={i}>
                          <img
                            src={"https://ui-avatars.com/api/?name=" + encodeURIComponent(l.username || "U") + "&background=01d676&color=0b0d14&size=64&bold=true"}
                            alt=""
                          />
                          <div className="info">
                            <span className="uname">{l.username || "User"}</span>
                            <span className="amount">+{money(l.amount || 0)}</span>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            )}
          </div>

          <main>
            {alert && <div className={"alert alert-" + alert.type}>{alert.text}</div>}

            {/* HOME – clean & minimal */}
            {page === "home" && (
              <div className="home-clean">
                <div className="hero">
                  <h1>Earn rewards.<br /><em>Cash out real money.</em></h1>
                  <p>Complete offers, games & surveys. <strong style={{ color: "var(--accent)" }}>1,000 pts = $1.00</strong></p>
                  <div className="hero-cta">
                    <button className="btn btn-primary" onClick={() => setPage("earn")}>
                      {user ? "Go to Earn" : "Get started"}
                    </button>
                  </div>
                </div>

                <div className="home-steps">
                  <div className="home-step">
                    <span className="n">1</span>
                    <div>
                      <strong>Earn</strong>
                      <span>Offers, games & surveys</span>
                    </div>
                  </div>
                  <div className="home-step">
                    <span className="n">2</span>
                    <div>
                      <strong>Collect points</strong>
                      <span>1,500 pts = +1 level</span>
                    </div>
                  </div>
                  <div className="home-step">
                    <span className="n">3</span>
                    <div>
                      <strong>Cash out</strong>
                      <span>Gift cards & more</span>
                    </div>
                  </div>
                </div>

                <div className="home-pills">
                  <span><i className="fas fa-gamepad" /> Games</span>
                  <span><i className="fas fa-mobile-screen" /> Apps</span>
                  <span><i className="fas fa-list-check" /> Surveys</span>
                  <span><i className="fas fa-gift" /> Gift cards</span>
                </div>
              </div>

            {/* PROFILE + TIERS */}
            {page === "profile" && (
              user ? (() => {

                const tier = getTier(score.overall);
                const pct = Math.min(100, score.overall);

                  <div className="card">
                    <div className="profile-hero">
                      <img

                      />
                      <div>
                        <h2>{user.username || user.account}</h2>
                        <div className="sub">Level {user.level || 1} · Balance {money(user.balance || 0)}</div>

                          {tier.id === "platinum" && <i className="fas fa-gem" />}
                          {tier.id === "gold" && <i className="fas fa-crown" />}
                          {tier.id === "silver" && <i className="fas fa-medal" />}
                          {tier.id === "none" && <i className="fas fa-circle" />}
                          {tier.name}
                        </div>
                      </div>
                    </div>

                    <div className="score-ring-wrap">
                      <div className="score-ring" style={{ ["--pct"]: pct }}>
                        <div className="inner">
                          <div className="val">{score.overall}</div>
                          <div className="lbl">Overall</div>
                        </div>
                      </div>
                      {tier.next ? (
                        <p style={{ fontSize: "0.85rem", color: "var(--text-secondary)" }}>
                          {Math.max(0, (tier.next.need - score.overall).toFixed(1))} pts to <strong style={{ color: "#fff" }}>{tier.next.name}</strong>

                        <p style={{ fontSize: "0.85rem", color: "var(--accent)", fontWeight: 700 }}>Top tier unlocked</p>

                    </div>

                    <div style={{
                      textAlign: "center", marginBottom: 16, padding: "12px 14px",

                    }}>
                      <div style={{ fontSize: "0.75rem", color: "var(--text-muted)", textTransform: "uppercase", letterSpacing: "0.5px" }}>Final overall score</div>
                      <div style={{ fontSize: "2rem", fontWeight: 900, color: "var(--accent)", lineHeight: 1.2 }}>{score.overall}</div>
                      <div style={{ fontSize: "0.8rem", color: "var(--text-secondary)", marginTop: 4 }}>
                        {score.tasksInLast100} completed tasks counted
                        {score.logTaskCount ? ` · ${score.logTaskCount} from activity logs` : ""}
                      </div>
                    </div>

                    <div className="score-breakdown">
                      <div className="score-item">
                        <div className="k">Today</div>
                        <div className="v">+{score.dailyScore}</div>
                        <div className="h">{score.tasksToday} / {TASKS_PER_DAY_GOAL} tasks · 3.33× each</div>
                      </div>
                      <div className="score-item">
                        <div className="k">Past tasks (max 100)</div>
                        <div className="v">+{score.historyScore}</div>
                        <div className="h">{score.tasksInLast100} tasks in history</div>
                      </div>
                      <div className="score-item">
                        <div className="k">Balance bonus</div>
                        <div className="v">{score.hasMinBalance ? "+12" : "0"}</div>
                        <div className="h">{score.hasMinBalance ? "≥ $1.00 held" : "Need ≥ $1.00 in balance"}</div>
                      </div>
                      <div className="score-item">
                        <div className="k">Level</div>
                        <div className="v">{user.level || 1}</div>
                        <div className="h">1,500 pts per level</div>
                      </div>
                    </div>

                    <div className="tier-ladder">
                      <h3 style={{ fontSize: "0.95rem", marginBottom: 10 }}>Tiers</h3>
                      {[
                        { id: "silver", name: "Silver", need: TIER_SILVER, icon: "fa-medal" },
                        { id: "gold", name: "Gold", need: TIER_GOLD, icon: "fa-crown" },
                        { id: "platinum", name: "Platinum", need: TIER_PLATINUM, icon: "fa-gem" }
                      ].map(t => (
                        <div key={t.id} className={"tier-row" + (tier.id === t.id ? " current" : "")}>
                          <div className="name"><i className={"fas " + t.icon} style={{ marginRight: 8, opacity: 0.85 }} />{t.name}</div>
                          <div className="req">Overall ≥ {t.need}{score.overall >= t.need ? " · Unlocked" : ""}</div>
                        </div>
                      ))}
                    </div>

                    <div className="tier-rules">
                      <strong style={{ color: "#fff" }}>How overall score works</strong>
                      <ul style={{ marginTop: 8, paddingLeft: 18 }}>
                        <li>Each completed offer or survey = <strong>1 task</strong> (last 100 counted).</li>
                        <li>Daily: <strong>3.33 × tasks today</strong> (max <strong>33.3</strong> at 10 tasks). If you do <strong>0 tasks today</strong>, today’s score is <strong>0</strong>.</li>
                        <li>History from your last 100 tasks contributes up to ~54.7.</li>
                        <li>Keep at least <strong>$1.00</strong> (1,000 pts) in balance for <strong>+12</strong> overall.</li>
                        <li>Silver 55 · Gold 75 · Platinum 85</li>
                        <li><strong>Silver</strong> — access Shop</li>
                        <li><strong>Gold</strong> — cash out + redeem promo codes</li>
                        <li><strong>Platinum</strong> — daily $0.10 permanent reward (once per day)</li>
                      </ul>
                    </div>

                    <button className="btn btn-primary" style={{ marginTop: 18 }} onClick={() => setPage("earn")}>
                      Complete tasks to raise score
                    </button>
                  </div>
                );
              })() : (
                <div className="card">
                  <h2>Profile</h2>
                  <p style={{ color: "var(--text-secondary)", marginBottom: 16 }}>Log in to view your tier and overall score.</p>
                  <button className="btn btn-primary" onClick={() => setPage("earn")}>Login</button>
                </div>
              )
            )}

            {/* EARN */}
            {page === "earn" && (
              user ? (
                <div className="card">
                  <h2>Earn</h2>
                  <p style={{ color: "var(--text-secondary)", marginBottom: 18, fontSize: "0.95rem" }}>
                    Choose an offerwall. Complete games, surveys & app tasks — get paid.
                  </p>
                  {loadingOffers ? <div className="empty">Loading offerwalls…</div>
                    : offerwalls.length === 0 ? <div className="empty">No offerwalls available.</div>
                    : (
                      <div className="offer-grid">
                        {offerwalls.map(ow => (
                          <div className="offer" key={ow.id}>
                            {ow.logo && <img src={ow.logo} alt={ow.name} onError={e => e.target.style.display = "none"} />}
                            <div style={{ fontSize: "0.875rem", marginBottom: 12, fontWeight: 600 }}>{ow.name}</div>
                            <button className="btn btn-primary" style={{ padding: "9px" }} onClick={() => openOfferwall(ow)}>Open</button>
                          </div>
                        ))}
                      </div>
                    )}
                </div>
              ) : (
                <div className="card">
                  <h2>Login</h2>
                  <div id="gbtn" />
                  <div className="divider"><span>OR</span></div>
                  <label>Account #</label>
                  <input value={loginForm.account} onChange={e => setLoginForm({ ...loginForm, account: e.target.value })} placeholder="Account number" />
                  <label>Client ID</label>
                  <input value={loginForm.clientId} onChange={e => setLoginForm({ ...loginForm, clientId: e.target.value })} placeholder="Client ID" />
                  <label>CAPTCHA</label>
                  <div className="captcha">{captcha}</div>
                  <input value={loginForm.captcha} onChange={e => setLoginForm({ ...loginForm, captcha: e.target.value })}
                    onKeyDown={e => e.key === "Enter" && handleLogin()} placeholder="Enter CAPTCHA" />
                  <button className="btn btn-primary" onClick={handleLogin} disabled={loggingIn}>
                    {loggingIn ? "Signing in…" : "Login"}
                  </button>
                </div>
              )
            )}

            {/* SHOP */}
            {page === "shop" && (
              <div className="card">
                <h2>Cashout</h2>
                <p style={{ color: "var(--text-secondary)", marginBottom: 18, fontSize: "0.9rem" }}>
                  <span className="balance-pill"><i className="fas fa-gem" style={{ fontSize: "0.8rem" }} /> {money(user?.balance || 0)}</span>
                  <span style={{ marginLeft: 10, fontSize: "0.75rem", color: "var(--text-muted)" }}>
                    ({Number(user?.balance || 0).toLocaleString()} pts)
                  </span>
                </p>
                {!user ? (
                  <button className="btn btn-primary" onClick={() => setPage("earn")}>Login to Cashout</button>
                ) : !canAccessShop(user) ? (
                  <div>
                    <div className="alert alert-warn">Silver tier required (overall ≥ 55) to access Shop.</div>
                    <p style={{ color: "var(--text-secondary)", fontSize: "0.9rem", marginBottom: 14 }}>
                      Your overall: <strong style={{ color: "#fff" }}>{userTierInfo(user).score.overall}</strong> · Tier: <strong style={{ color: "#fff" }}>{userTierInfo(user).tier.name}</strong>
                    </p>
                    <button className="btn btn-primary" onClick={() => setPage("profile")}>View profile & score</button>
                  </div>
                ) : !canCashout(user) ? (
                  <div>
                    <div className="alert alert-warn">Gold tier required (overall ≥ 75) to cash out. You can browse as Silver, but withdrawals unlock at Gold.</div>
                    <p style={{ color: "var(--text-secondary)", fontSize: "0.9rem", marginBottom: 14 }}>
                      Your overall: <strong style={{ color: "#fff" }}>{userTierInfo(user).score.overall}</strong> · Tier: <strong style={{ color: "#fff" }}>{userTierInfo(user).tier.name}</strong>
                    </p>
                    <button className="btn btn-primary" onClick={() => setPage("profile")}>View profile & score</button>
                    <button className="btn btn-ghost" style={{ marginTop: 10 }} onClick={() => setPage("earn")}>Keep earning</button>
                  </div>
                ) : selectedBrand ? (
                  <>
                    <button className="brand-back" onClick={() => { setSelectedBrand(null); setProducts({ fixed: [], ranges: [] }); setSelectedDenom(null); setCustomAmount(""); }}>
                      <i className="fas fa-arrow-left" /> Back to brands
                    </button>
                    <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 16 }}>
                      {selectedBrand.logo && <img src={selectedBrand.logo} alt="" style={{ height: 36, maxWidth: 90, objectFit: "contain" }} onError={e => e.target.style.display = "none"} />}
                      <div>
                        <div style={{ fontWeight: 600, color: "#fff", fontSize: "1rem" }}>{selectedBrand.name}</div>
                        <div style={{ fontSize: "0.75rem", color: "var(--text-muted)" }}>Country: {country}</div>
                      </div>
                    </div>
                    {loadingProducts ? <div className="empty">Loading denominations…</div> : (
                      <>
                        {products.fixed.length > 0 && (
                          <>
                            <label>Choose amount</label>
                            <div className="denom-grid">
                              {products.fixed.map((d, i) => (
                                <button key={i} type="button"
                                  className={"denom-chip" + (selectedDenom && selectedDenom.value === d.value && !customAmount ? " active" : "")}
                                  onClick={() => { setSelectedDenom(d); setCustomAmount(""); }}>
                                  {d.label}
                                </button>
                              ))}
                            </div>
                          </>
                        )}
                        {(products.ranges.length > 0 || products.fixed.length === 0) && (
                          <>
                            <label>{products.fixed.length ? "Or custom amount (USD)" : "Amount (USD)"}</label>
                            <input type="number" step="0.01"
                              min={products.ranges[0] ? products.ranges[0].min : 1}
                              max={products.ranges[0] ? products.ranges[0].max : undefined}
                              value={customAmount}
                              onChange={e => { setCustomAmount(e.target.value); setSelectedDenom(null); }}
                              placeholder={products.ranges[0] ? "Min " + products.ranges[0].min + (products.ranges[0].max ? " – max " + products.ranges[0].max : "") : "e.g. 25"} />
                          </>
                        )}
                        <label>Delivery email</label>
                        <input value={email} onChange={e => setEmail(e.target.value)} placeholder="you@email.com" />
                        <button className="btn btn-primary" disabled={submitting} onClick={submitGiftCard}>
                          {submitting ? "Submitting…" : "Redeem gift card"}
                        </button>
                      </>
                    )}
                  </>
                ) : (
                  <>
                    <div className="section-label">Gift cards (CryptoRefills catalog)</div>
                    <div className="cr-toolbar">
                      <div className="field">
                        <label>Country</label>
                        <select value={country} onChange={e => { setCountry(e.target.value); setBrandSearch(""); }}>
                          {COUNTRIES.map(c => <option key={c.code} value={c.code}>{c.name} ({c.code})</option>)}
                        </select>
                      </div>
                      <div className="field">
                        <label>Search brands</label>
                        <input value={brandSearch} onChange={e => { setBrandSearch(e.target.value); setBrandPage(1); }} placeholder="e.g. Amazon, Steam…" />
                      </div>
                      <div className="field-btn">
                        <button className="btn btn-ghost" style={{ width: "auto", padding: "10px 14px" }} onClick={() => loadBrands(country)} disabled={loadingBrands}>
                          <i className={"fas " + (loadingBrands ? "fa-spinner fa-spin" : "fa-sync")} />
                        </button>
                      </div>
                    </div>
                    {brandError && <div className="alert alert-error">{brandError}</div>}
                    {loadingBrands ? <div className="empty">Loading brands for {country}…</div>
                      : filteredBrands.length === 0 ? <div className="empty">No brands found.</div>
                      : (
                        <>
                          <div className="cr-count" style={{ fontSize: "0.8rem", color: "var(--text-muted)", marginBottom: 10 }}>
                            {filteredBrands.length} brand{filteredBrands.length === 1 ? "" : "s"} {brandSearch ? 'matching "' + brandSearch.trim() + '"' : ""}
                          </div>
                          <div className="reward-grid">
                            {shownBrands.map(b => (
                              <div className="reward-item" key={b.id} onClick={() => loadProducts(b)}>
                                {b.logo
                                  ? <img src={b.logo} alt={b.name} onError={e => e.target.style.display = "none"} />
                                  : <div style={{ height: 32, marginBottom: 10, fontSize: "1.3rem", color: "var(--accent)" }}><i className="fas fa-gift" /></div>}
                                <div className="name">{b.name}</div>
                                <div className="tag">Select</div>
                              </div>
                            ))}
                          </div>
                          {shownBrands.length < filteredBrands.length && (
                            <button className="btn btn-ghost" style={{ marginTop: 14 }} onClick={() => setBrandPage(p => p + 1)}>
                              Show more ({filteredBrands.length - shownBrands.length} left)
                            </button>
                          )}
                        </>
                      )}
                  </>
                )}
              </div>
            )}

            {/* CHAT page */}
            {page === "chat" && (
