    // ============================================================
    // ADMIN PANEL
    // ============================================================
    const ADMIN_TOKEN_KEY = "rewardbux_admin_token";

    function AdminPanel({ onExit }) {
      const [authed, setAuthed] = useState(false);
      const [token, setToken] = useState("");
      const [password, setPassword] = useState("");
      const [loggingIn, setLoggingIn] = useState(false);
      const [alert, setAlert] = useState(null);
      const [tab, setTab] = useState("dashboard");
      const [stats, setStats] = useState(null);
      const [users, setUsers] = useState([]);
      const [cashouts, setCashouts] = useState([]);
      const [chatMsgs, setChatMsgs] = useState([]);
      const [bonusCodes, setBonusCodes] = useState([]);
      const [offerwalls, setOfferwalls] = useState([]);
      const [loading, setLoading] = useState(false);
      const [search, setSearch] = useState("");
      const [statusFilter, setStatusFilter] = useState("all");
      const [busy, setBusy] = useState(null);
      const [bonusForm, setBonusForm] = useState({ code: "", amountUsd: "", maxUses: "1" });
      const [owForm, setOwForm] = useState({ id: "", name: "", logo: "", urlTemplate: "" });
      const [editOw, setEditOw] = useState(null);
      const [adjustUser, setAdjustUser] = useState(null);
      const [adjustPts, setAdjustPts] = useState("");
      const [adjustNote, setAdjustNote] = useState("");
      const tokenRef = useRef("");

      function showAlert(text, type = "error") {
        setAlert({ text, type });
        setTimeout(() => setAlert(null), 4000);
      }

      function adminParams(extra = {}) {
        return { adminKey: tokenRef.current, password: tokenRef.current, ...extra };
      }

      useEffect(() => {
        try {
          const t = localStorage.getItem(ADMIN_TOKEN_KEY);
          if (t) { setToken(t); tokenRef.current = t; setAuthed(true); }
        } catch {}
      }, []);

      const loadStats = useCallback(async () => {
        setLoading(true);
        const res = await apiGet("adminStats", adminParams());
        setLoading(false);
        if (res.error) {
          const [logs, leaders, chat] = await Promise.all([
            apiGet("logs"), apiGet("leaders"), apiGet("getChat", { limit: 20 })
          ]);
          setStats({
            totalUsers: (leaders.leaders || []).length,
            totalPaidUsd: "—",
            pendingCashouts: 0,
            chatMessages: (chat.messages || []).length,
            note: "adminStats not available – showing partial data"
          });
        } else setStats(res.stats || res);
      }, []);

      const loadUsers = useCallback(async () => {
        setLoading(true);
        const res = await apiGet("adminUsers", adminParams({ search }));
        setLoading(false);
        if (res.error) {
          const leaders = await apiGet("leaders");
          setUsers((leaders.leaders || []).map((u, i) => ({
            account: u.account || u.username || String(i),
            username: u.username, balance: u.balance || 0, level: u.level || 1,
            email: u.email || "", banned: false
          })));
          if (res.error) showAlert("adminUsers API: " + res.error + " (showing leaders fallback)", "warn");
        } else setUsers(res.users || []);
      }, [search]);

      const loadCashouts = useCallback(async () => {
        setLoading(true);
        const res = await apiGet("adminCashouts", adminParams({ status: statusFilter === "all" ? "" : statusFilter }));
        setLoading(false);
        if (res.error) { showAlert("adminCashouts: " + res.error); setCashouts([]); }
        else setCashouts(res.cashouts || []);
      }, [statusFilter]);

      const loadChat = useCallback(async () => {
        setLoading(true);
        const res = await apiGet("getChat", { limit: 100 });
        setLoading(false);
        if (res.messages) setChatMsgs(res.messages);
      }, []);

      const loadBonus = useCallback(async () => {
        setLoading(true);
        const res = await apiGet("adminBonusCodes", adminParams());
        setLoading(false);
        if (res.error) { setBonusCodes([]); if (res.error !== "Unauthorized") showAlert("adminBonusCodes: " + res.error); }
        else setBonusCodes(res.codes || res.bonusCodes || []);
      }, []);

      const loadOfferwalls = useCallback(async () => {
        setLoading(true);
        const res = await apiGet("getOfferwalls");
        setLoading(false);
        setOfferwalls(Array.isArray(res.offerwalls) ? res.offerwalls : []);
      }, []);

      useEffect(() => {
        if (!authed) return;
        if (tab === "dashboard") loadStats();
        else if (tab === "users") loadUsers();
        else if (tab === "cashouts") loadCashouts();
        else if (tab === "chat") loadChat();
        else if (tab === "bonus") loadBonus();
        else if (tab === "offerwalls") loadOfferwalls();
      }, [authed, tab]);

      async function updateCashout(id, status, giftCode = "") {
        setBusy(id + status);
        const res = await apiPost("adminUpdateCashout", adminParams({ id: String(id), status, giftCode: giftCode || "" }));
        setBusy(null);
        if (res.error) showAlert(res.error);
        else { showAlert("Cashout updated → " + status, "success"); loadCashouts(); }
      }

      async function banUser(account, banned) {
        setBusy("ban-" + account);
        const res = await apiPost("adminBanUser", adminParams({ account: String(account), banned: banned ? "1" : "0" }));
        setBusy(null);
        if (res.error) showAlert(res.error);
        else { showAlert(banned ? "User banned" : "User unbanned", "success"); loadUsers(); }
      }

      async function adjustBalance() {
        if (!adjustUser) return;
        const pts = parseInt(adjustPts, 10);
        if (isNaN(pts)) return showAlert("Enter points (can be negative)");
        setBusy("adjust");
        const res = await apiPost("adminAdjustBalance", adminParams({
          account: String(adjustUser.account || adjustUser.username),
          amount: String(pts),
          note: adjustNote || ""
        }));
        setBusy(null);
        if (res.error) showAlert(res.error);
        else {
          showAlert("Balance adjusted by " + pts + " pts", "success");
          setAdjustUser(null); setAdjustPts(""); setAdjustNote("");
          loadUsers();
        }
      }

      async function createBonus() {
        const code = (bonusForm.code || "").trim().toUpperCase();
        const amt = parseFloat(bonusForm.amountUsd);
        if (!code) return showAlert("Enter a code");
        if (!amt || amt <= 0) return showAlert("Enter amount in USD");
        setBusy("bonus-create");
        const res = await apiPost("adminCreateBonus", adminParams({
          code, amountUsd: amt.toFixed(2), amount: String(Math.round(amt * POINTS_PER_DOLLAR)), maxUses: bonusForm.maxUses || "1"
        }));
        setBusy(null);
        if (res.error) showAlert(res.error);
        else {
          showAlert("Bonus code created: " + code, "success");
          setBonusForm({ code: "", amountUsd: "", maxUses: "1" });
          loadBonus();
        }
      }

      async function deleteBonus(code) {
        if (!window.confirm("Delete code " + code + "?")) return;
        setBusy("bonus-" + code);
        const res = await apiPost("adminDeleteBonus", adminParams({ code: String(code) }));
        setBusy(null);
        if (res.error) showAlert(res.error);
        else { showAlert("Bonus code deleted", "success"); loadBonus(); }
      }

      async function saveOfferwall() {
        const name = (owForm.name || "").trim();
        const url = (owForm.urlTemplate || "").trim();
        if (!name || !url) return showAlert("Name and URL template required");
        setBusy("ow-save");
        const res = await apiPost("adminSaveOfferwall", adminParams({
          id: editOw || owForm.id || "", name, logo: owForm.logo || "", urlTemplate: url
        }));
        setBusy(null);
        if (res.error) showAlert(res.error);
        else {
          showAlert(editOw ? "Offerwall updated" : "Offerwall added", "success");
          setOwForm({ id: "", name: "", logo: "", urlTemplate: "" });
          setEditOw(null);
          loadOfferwalls();
        }
      }

      async function deleteOfferwall(id, name) {
        if (!window.confirm("Delete offerwall " + name + "?")) return;
        setBusy("ow-" + id);
        const res = await apiPost("adminDeleteOfferwall", adminParams({ id: String(id) }));
        setBusy(null);
        if (res.error) showAlert(res.error);
        else { showAlert("Offerwall deleted", "success"); loadOfferwalls(); }
      }

      async function deleteChat(id) {
        if (!window.confirm("Delete this message?")) return;
        setBusy("chat-" + id);
        const res = await apiPost("adminDeleteChat", adminParams({ id: String(id) }));
        setBusy(null);
        if (res.error) showAlert(res.error);
        else { showAlert("Message deleted", "success"); loadChat(); }
      }

      function logoutAdmin() {
        setAuthed(false); setToken(""); tokenRef.current = "";
        try { localStorage.removeItem(ADMIN_TOKEN_KEY); } catch {}
        if (onExit) onExit();
      }

      if (!authed) {
        return (
          <div className="admin-app">
            <div className="card admin-login">
              <h2><i className="fas fa-shield-halved" style={{ color: "var(--accent)", marginRight: 8 }} /> Admin Login</h2>
              <p className="sub">Enter the admin password configured in your Google Apps Script backend.</p>
              {alert && <div className={"alert alert-" + alert.type}>{alert.text}</div>}
              <form onSubmit={async e => {
                e.preventDefault();
                if (!password.trim()) return showAlert("Enter admin password");
                setLoggingIn(true);
                const res = await apiPost("adminLogin", { password: password.trim() });
                setLoggingIn(false);
                if (res.error) return showAlert(res.error || "Invalid password");
                const t = res.token || password.trim();
                setToken(t); tokenRef.current = t;
                try { localStorage.setItem(ADMIN_TOKEN_KEY, t); } catch {}
                setAuthed(true); setPassword("");
                showAlert("Welcome, admin", "success");
              }}>
                <label>Admin password</label>
                <input type="password" value={password} onChange={e => setPassword(e.target.value)} placeholder="••••••••" autoFocus />
                <button className="btn btn-primary" type="submit" disabled={loggingIn}>
                  {loggingIn ? "Signing in…" : "Enter admin panel"}
                </button>
              </form>
              <button className="btn btn-ghost" style={{ marginTop: 12 }} onClick={() => onExit ? onExit() : window.location.href = "/"}>
                ← Back to site
              </button>
              <p className="admin-note">Backend must implement action <code>adminLogin</code> (POST) that accepts <code>password</code> and returns <code>{"{ token }"}</code> on success.</p>
            </div>
          </div>
        );
      }

      return (
        <div className="admin-app">
          <div className="admin-header">
            <div className="admin-header-row">
              <div className="admin-logo">
                <img src="https://i.ibb.co/s9MLLtHD/IMG-3307.png" alt="RewardBux" style={{ height: 32, width: "auto", objectFit: "contain" }} />
                <span className="badge-admin">ADMIN</span>
              </div>
              <div className="admin-nav">
                {[
                  { id: "dashboard", icon: "fa-chart-line", label: "Dashboard" },
                  { id: "users", icon: "fa-users", label: "Users" },
                  { id: "cashouts", icon: "fa-money-bill-transfer", label: "Cashouts" },
                  { id: "chat", icon: "fa-comments", label: "Chat" },
                  { id: "bonus", icon: "fa-gift", label: "Bonus codes" },
                  { id: "offerwalls", icon: "fa-th-large", label: "Offerwalls" }
                ].map(t => (
                  <button key={t.id} className={"admin-nav-item" + (tab === t.id ? " active" : "")} onClick={() => setTab(t.id)}>
                    <i className={"fas " + t.icon} />{t.label}
                  </button>
                ))}
              </div>
              <div className="admin-header-right">
                <button className="btn-sm" onClick={() => onExit ? onExit() : window.location.href = "/"}>
                  <i className="fas fa-external-link-alt" /> Site
                </button>
                <button className="btn-sm danger" onClick={logoutAdmin}>
                  <i className="fas fa-sign-out-alt" /> Logout
                </button>
              </div>
            </div>
          </div>

          <div className="admin-main">
            {alert && <div className={"alert alert-" + alert.type}>{alert.text}</div>}

            {tab === "dashboard" && (
              <>
                <div className="card">
                  <h2>Dashboard</h2>
                  {loading && !stats ? <div className="admin-empty">Loading…</div> : (
                    <div className="stats-grid">
                      <div className="stat-card"><div className="stat-label">Users</div><div className="stat-value">{stats?.totalUsers ?? "—"}</div><div className="stat-sub">Registered accounts</div></div>
                      <div className="stat-card"><div className="stat-label">Pending cashouts</div><div className="stat-value warn">{stats?.pendingCashouts ?? "—"}</div><div className="stat-sub">Awaiting review</div></div>
                      <div className="stat-card"><div className="stat-label">Total paid</div><div className="stat-value accent">{stats?.totalPaidUsd != null ? (typeof stats.totalPaidUsd === "number" ? "$" + Number(stats.totalPaidUsd).toFixed(2) : stats.totalPaidUsd) : "—"}</div><div className="stat-sub">Lifetime payouts</div></div>
                      <div className="stat-card"><div className="stat-label">Chat messages</div><div className="stat-value">{stats?.chatMessages ?? "—"}</div><div className="stat-sub">Recent activity</div></div>
                    </div>
                  )}
                  {stats?.note && <div className="alert alert-warn">{stats.note}</div>}
                  <div className="admin-toolbar">
                    <button className="btn btn-ghost" style={{ width: "auto" }} onClick={loadStats}><i className="fas fa-sync" /> Refresh</button>
                  </div>
                </div>
                <div className="card">
                  <h2>Quick links</h2>
                  <div className="admin-actions" style={{ gap: 10 }}>
                    <button className="btn btn-primary" style={{ width: "auto" }} onClick={() => setTab("cashouts")}>Review cashouts</button>
                    <button className="btn btn-ghost" style={{ width: "auto" }} onClick={() => setTab("users")}>Manage users</button>
                    <button className="btn btn-ghost" style={{ width: "auto" }} onClick={() => setTab("bonus")}>Create bonus code</button>
                  </div>
                </div>
              </>
            )}

            {tab === "users" && (
              <div className="card">
                <h2>Users</h2>
                <div className="admin-toolbar">
                  <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Search username / account…" onKeyDown={e => e.key === "Enter" && loadUsers()} />
                  <button className="btn btn-ghost" style={{ width: "auto", padding: "10px 14px" }} onClick={loadUsers}><i className="fas fa-search" /> Search</button>
                  <div className="spacer" />
                  <button className="btn btn-ghost" style={{ width: "auto" }} onClick={loadUsers}><i className="fas fa-sync" /> Refresh</button>
                </div>
                {loading ? <div className="admin-empty">Loading users…</div>
                  : users.length === 0 ? <div className="admin-empty">No users found.</div>
                  : (
                    <div className="admin-table-wrap">
                      <table className="admin-table">
                        <thead><tr><th>User</th><th>Balance</th><th>Level</th><th>Status</th><th>Actions</th></tr></thead>
                        <tbody>
                          {users.map((u, i) => (
                            <tr key={u.account || u.username || i}>
                              <td>
                                <div className="user-cell">
                                  <img src={u.avatar || "https://ui-avatars.com/api/?name=" + encodeURIComponent(u.username || "U") + "&background=0d9488&color=fff&size=64"} alt="" />
                                  <div>
                                    <div className="uname">{u.username || u.account}</div>
                                    <div className="uemail">{u.email || u.account || "—"}</div>
                                  </div>
                                </div>
                              </td>
                              <td style={{ color: "var(--accent)", fontWeight: 600 }}>{money(u.balance || 0)}</td>
                              <td>{u.level || 1}</td>
                              <td>{u.banned ? <span className="badge badge-unsent">Banned</span> : <span className="badge badge-sent">Active</span>}</td>
                              <td>
                                <div className="admin-actions">
                                  <button className="btn-sm" onClick={() => { setAdjustUser(u); setAdjustPts(""); setAdjustNote(""); }}>Adjust $</button>
                                  <button className={"btn-sm " + (u.banned ? "success" : "danger")}
                                    disabled={busy === "ban-" + (u.account || u.username)}
                                    onClick={() => banUser(u.account || u.username, !u.banned)}>
                                    {u.banned ? "Unban" : "Ban"}
                                  </button>
                                </div>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  )}
                {adjustUser && (
                  <div className="modal-overlay" onClick={e => e.target === e.currentTarget && setAdjustUser(null)}>
                    <div className="modal">
                      <div className="modal-header">
                        <h3>Adjust balance — {adjustUser.username || adjustUser.account}</h3>
                        <button className="modal-close" onClick={() => setAdjustUser(null)}><i className="fas fa-times" /></button>
                      </div>
                      <p style={{ fontSize: "0.85rem", color: "var(--text-muted)", marginBottom: 12 }}>
                        Current: {money(adjustUser.balance || 0)} ({Number(adjustUser.balance || 0).toLocaleString()} pts)
                      </p>
                      <label>Points to add (negative to subtract)</label>
                      <input type="number" value={adjustPts} onChange={e => setAdjustPts(e.target.value)} placeholder="e.g. 1000 or -500" autoFocus />
                      <label>Note (optional)</label>
                      <input value={adjustNote} onChange={e => setAdjustNote(e.target.value)} placeholder="Reason…" />
                      <div className="btn-row">
                        <button className="btn btn-ghost" onClick={() => setAdjustUser(null)}>Cancel</button>
                        <button className="btn btn-primary" onClick={adjustBalance} disabled={busy === "adjust"}>
                          {busy === "adjust" ? "Saving…" : "Apply"}
                        </button>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            )}

            {tab === "cashouts" && (
              <div className="card">
                <h2>Cashouts</h2>
                <div className="admin-toolbar">
                  <div className="chip-row" style={{ marginBottom: 0 }}>
                    {["all", "unsent", "pending", "sent"].map(s => (
                      <button key={s} className={"chip" + (statusFilter === s ? " active" : "")} onClick={() => setStatusFilter(s)}>
                        {s.charAt(0).toUpperCase() + s.slice(1)}
                      </button>
                    ))}
                  </div>
                  <div className="spacer" />
                  <button className="btn btn-ghost" style={{ width: "auto" }} onClick={loadCashouts}><i className="fas fa-sync" /> Refresh</button>
                </div>
                {loading ? <div className="admin-empty">Loading cashouts…</div>
                  : cashouts.length === 0 ? <div className="admin-empty">No cashouts found.</div>
                  : (
                    <div className="admin-table-wrap">
                      <table className="admin-table">
                        <thead><tr><th>User</th><th>Reward</th><th>Amount</th><th>Status</th><th>Details</th><th>Actions</th></tr></thead>
                        <tbody>
                          {cashouts.map((c, i) => {
                            let amt = c.amountUsd || c.amount || "0";
                            const n = parseFloat(amt);
                            if (!isNaN(n) && n >= 100) amt = (n / POINTS_PER_DOLLAR).toFixed(2);
                            else if (!isNaN(n)) amt = n.toFixed(2);
                            const id = c.id || c.row || i;
                            return (
                              <tr key={id}>
                                <td>
                                  <div className="uname" style={{ fontWeight: 600 }}>{c.username || c.account}</div>
                                  <div className="uemail" style={{ fontSize: "0.7rem", color: "var(--text-muted)" }}>{c.account}</div>
                                </td>
                                <td>{c.rewardName || c.brand_name || c.rewardType || "—"}</td>
                                <td style={{ color: "var(--accent)", fontWeight: 600 }}>${amt}</td>
                                <td><StatusBadge status={c.status} /></td>
                                <td><div className="gift-code-cell" title={c.details || c.email || c.giftCode || ""}>{c.giftCode || c.details || c.email || "—"}</div></td>
                                <td>
                                  <div className="admin-actions">
                                    {String(c.status).toLowerCase() !== "pending" && (
                                      <button className="btn-sm warn" disabled={!!busy} onClick={() => updateCashout(id, "pending")}>Pending</button>
                                    )}
                                    {String(c.status).toLowerCase() !== "sent" && (
                                      <button className="btn-sm success" disabled={!!busy} onClick={() => {
                                        const code = window.prompt("Gift code (optional):", c.giftCode || "");
                                        if (code !== null) updateCashout(id, "sent", code);
                                      }}>Mark sent</button>
                                    )}
                                    {String(c.status).toLowerCase() !== "rejected" && (
                                      <button className="btn-sm danger" disabled={!!busy} onClick={() => {
                                        if (window.confirm("Reject this cashout? Balance may be refunded by backend.")) updateCashout(id, "rejected");
                                      }}>Reject</button>
                                    )}
                                  </div>
                                </td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  )}
                <p className="admin-note">Requires backend actions: <code>adminCashouts</code>, <code>adminUpdateCashout</code> (id, status, giftCode).</p>
              </div>
            )}

            {tab === "chat" && (
              <div className="card">
                <h2>Chat moderation</h2>
                <div className="admin-toolbar">
                  <button className="btn btn-ghost" style={{ width: "auto" }} onClick={loadChat}><i className="fas fa-sync" /> Refresh</button>
                </div>
                {loading ? <div className="admin-empty">Loading messages…</div>
                  : chatMsgs.length === 0 ? <div className="admin-empty">No messages.</div>
                  : (
                    <div className="admin-table-wrap">
                      <table className="admin-table">
                        <thead><tr><th>Time</th><th>User</th><th>Message</th><th /></tr></thead>
                        <tbody>
                          {[...chatMsgs].reverse().map(m => (
                            <tr key={m.id}>
                              <td className="mono" style={{ whiteSpace: "nowrap" }}>{m.time}</td>
                              <td>
                                <span style={{ fontWeight: 600, color: m.isAdmin ? "var(--warning)" : "var(--accent)" }}>{m.username}</span>
                                {m.isAdmin && <span className="badge-owner" style={{ marginLeft: 6 }}>Owner</span>}
                              </td>
                              <td style={{ maxWidth: 320, wordBreak: "break-word" }}>{m.message}</td>
                              <td>
                                <button className="btn-sm danger" disabled={busy === "chat-" + m.id} onClick={() => deleteChat(m.id)}>Delete</button>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  )}
                <p className="admin-note">Requires backend action: <code>adminDeleteChat</code> (id).</p>
              </div>
            )}

            {tab === "bonus" && (
              <div className="card">
                <h2>Bonus codes</h2>
                <div style={{ marginBottom: 20, padding: 16, background: "var(--bg)", borderRadius: "var(--radius-sm)", border: "1px solid var(--border)" }}>
                  <div style={{ fontWeight: 600, marginBottom: 12, color: "#fff" }}>Create new code</div>
                  <div className="form-row">
                    <div>
                      <label>Code</label>
                      <input value={bonusForm.code} onChange={e => setBonusForm(f => ({ ...f, code: e.target.value.toUpperCase() }))} placeholder="WELCOME10" />
                    </div>
                    <div>
                      <label>Amount (USD)</label>
                      <input type="number" step="0.01" value={bonusForm.amountUsd} onChange={e => setBonusForm(f => ({ ...f, amountUsd: e.target.value }))} placeholder="1.00" />
                    </div>
                  </div>
                  <div className="form-row">
                    <div>
                      <label>Max uses</label>
                      <input type="number" min="1" value={bonusForm.maxUses} onChange={e => setBonusForm(f => ({ ...f, maxUses: e.target.value }))} placeholder="1" />
                    </div>
                    <div style={{ display: "flex", alignItems: "flex-end" }}>
                      <button className="btn btn-primary" style={{ marginBottom: 12 }} onClick={createBonus} disabled={busy === "bonus-create"}>
                        {busy === "bonus-create" ? "Creating…" : "Create code"}
                      </button>
                    </div>
                  </div>
                </div>
                <div className="admin-toolbar">
                  <button className="btn btn-ghost" style={{ width: "auto" }} onClick={loadBonus}><i className="fas fa-sync" /> Refresh</button>
                </div>
                {loading ? <div className="admin-empty">Loading…</div>
                  : bonusCodes.length === 0 ? <div className="admin-empty">No bonus codes yet.</div>
                  : (
                    <div className="admin-table-wrap">
                      <table className="admin-table">
                        <thead><tr><th>Code</th><th>Amount</th><th>Uses</th><th>Max</th><th /></tr></thead>
                        <tbody>
                          {bonusCodes.map((c, i) => (
                            <tr key={c.code || i}>
                              <td className="mono" style={{ fontWeight: 600, color: "var(--accent)" }}>{c.code}</td>
                              <td>${parseFloat(c.amountUsd || (c.amount ? c.amount / POINTS_PER_DOLLAR : 0)).toFixed(2)}</td>
                              <td>{c.uses ?? c.used ?? 0}</td>
                              <td>{c.maxUses ?? c.max ?? "∞"}</td>
                              <td>
                                <button className="btn-sm danger" disabled={busy === "bonus-" + c.code} onClick={() => deleteBonus(c.code)}>Delete</button>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  )}
                <p className="admin-note">Requires: <code>adminBonusCodes</code>, <code>adminCreateBonus</code>, <code>adminDeleteBonus</code>.</p>
              </div>
            )}

            {tab === "offerwalls" && (
              <div className="card">
                <h2>Offerwalls</h2>
                <div style={{ marginBottom: 20, padding: 16, background: "var(--bg)", borderRadius: "var(--radius-sm)", border: "1px solid var(--border)" }}>
                  <div style={{ fontWeight: 600, marginBottom: 12, color: "#fff" }}>{editOw ? "Edit offerwall" : "Add offerwall"}</div>
                  <label>Name</label>
                  <input value={owForm.name} onChange={e => setOwForm(f => ({ ...f, name: e.target.value }))} placeholder="AdGate / Torox / …" />
                  <label>Logo URL (optional)</label>
                  <input value={owForm.logo} onChange={e => setOwForm(f => ({ ...f, logo: e.target.value }))} placeholder="https://…" />
                  <label>URL template</label>
                  <input value={owForm.urlTemplate} onChange={e => setOwForm(f => ({ ...f, urlTemplate: e.target.value }))} placeholder="https://example.com/wall?user={user}" />
                  <p style={{ fontSize: "0.72rem", color: "var(--text-muted)", marginBottom: 12 }}>
                    Use placeholders: {"{user}"}, {"{userid}"}, {"{username}"}, {"{account}"}
                  </p>
                  <div className="btn-row">
                    {editOw && <button className="btn btn-ghost" onClick={() => { setEditOw(null); setOwForm({ id: "", name: "", logo: "", urlTemplate: "" }); }}>Cancel</button>}
                    <button className="btn btn-primary" onClick={saveOfferwall} disabled={busy === "ow-save"}>
                      {busy === "ow-save" ? "Saving…" : editOw ? "Update" : "Add offerwall"}
                    </button>
                  </div>
                </div>
                <div className="admin-toolbar">
                  <button className="btn btn-ghost" style={{ width: "auto" }} onClick={loadOfferwalls}><i className="fas fa-sync" /> Refresh</button>
                </div>
                {loading ? <div className="admin-empty">Loading…</div>
                  : offerwalls.length === 0 ? <div className="admin-empty">No offerwalls configured.</div>
                  : (
                    <div className="admin-table-wrap">
                      <table className="admin-table">
                        <thead><tr><th>Name</th><th>URL template</th><th /></tr></thead>
                        <tbody>
                          {offerwalls.map(ow => (
                            <tr key={ow.id}>
                              <td>
                                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                                  {ow.logo && <img src={ow.logo} alt="" style={{ height: 24, maxWidth: 40, objectFit: "contain" }} onError={e => e.target.style.display = "none"} />}
                                  <strong>{ow.name}</strong>
                                </div>
                              </td>
                              <td className="mono" style={{ maxWidth: 280, overflow: "hidden", textOverflow: "ellipsis" }}>{ow.urlTemplate || ow.url || "—"}</td>
                              <td>
                                <div className="admin-actions">
                                  <button className="btn-sm" onClick={() => {
                                    setEditOw(ow.id);
                                    setOwForm({ id: ow.id, name: ow.name || "", logo: ow.logo || "", urlTemplate: ow.urlTemplate || ow.url || "" });
                                  }}>Edit</button>
                                  <button className="btn-sm danger" disabled={busy === "ow-" + ow.id} onClick={() => deleteOfferwall(ow.id, ow.name)}>Delete</button>
                                </div>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  )}
                <p className="admin-note">Requires: <code>adminSaveOfferwall</code>, <code>adminDeleteOfferwall</code>. Public <code>getOfferwalls</code> already exists.</p>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ============================================================
    // ROOT – switch between App and Admin
    // ============================================================
    function isAdminRoute() {
      const path = (window.location.pathname || "").toLowerCase();
      const hash = (window.location.hash || "").toLowerCase();
      const params = new URLSearchParams(window.location.search);
      return path.includes("/admin") || hash === "#admin" || hash.startsWith("#admin") || params.get("admin") === "1" || params.get("admin") === "true";
    }

    function Root() {
      const [admin, setAdmin] = useState(isAdminRoute());

      useEffect(() => {
        const handler = () => setAdmin(isAdminRoute());
        window.addEventListener("popstate", handler);
        window.addEventListener("hashchange", handler);
        return () => {
          window.removeEventListener("popstate", handler);
          window.removeEventListener("hashchange", handler);
        };
      }, []);

      return admin
        ? <AdminPanel onExit={() => { window.history.pushState({}, "", "/"); setAdmin(false); }} />
        : <App />;
    }

    // Mount
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<StrictMode><Root /></StrictMode>);
  </script>
</body>
</html>
