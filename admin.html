<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RewardBux Admin</title>
  <meta name="theme-color" content="#0c0f12" />
  <link rel="icon" href="https://i.imgur.com/wppiqAy.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    :root {
      --bg: #0c0f12;
      --bg-secondary: #151a1f;
      --card: #171c22;
      --card-hover: #1e252d;
      --border: #2c353f;
      --text: #d8dde3;
      --muted: #8b949e;
      --accent: #00b8a9;
      --accent-2: #e8a838;
      --accent-light: #5eead4;
      --success: #3dd68c;
      --danger: #f07178;
      --warning: #e8a838;
      --radius: 3px;
      --shadow: inset 0 1px 0 rgba(255,255,255,0.04), 0 1px 2px rgba(0,0,0,0.4);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Roboto', 'Noto Sans', 'Droid Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.35;
      font-size: 13px;
      -webkit-font-smoothing: antialiased;
    }
    .app {
      max-width: 1100px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }

    /* Login */
    .login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: var(--bg);
    }
    .login-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px 24px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      box-shadow: var(--shadow);
    }
    .login-box .logo {
      font-weight: 700;
      font-size: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      margin-bottom: 10px;
      color: #fff;
    }
    .login-box .logo .dollar { color: var(--accent); }
    .login-box .logo span { color: var(--accent-light); }
    .login-box h1 { font-size: 1.15rem; margin-bottom: 4px; color: #fff; font-weight: 500; }
    .login-box p { color: var(--muted); margin-bottom: 18px; font-size: 0.8rem; }
    .login-box input {
      width: 100%;
      padding: 9px 11px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.85rem;
      margin-bottom: 12px;
      font-family: inherit;
    }
    .login-box input:focus { outline: none; border-color: var(--accent); }

    /* Header */
    header {
      background: #12171c;
      border-bottom: 1px solid var(--border);
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50;
      min-height: 48px;
    }
    .logo {
      font-weight: 700;
      font-size: 1.15rem;
      display: flex;
      align-items: center;
      gap: 2px;
      color: #fff;
    }
    .logo .dollar { color: var(--accent); }
    .logo span.brand { color: var(--accent-light); }
    .logo .admin-label {
      font-size: 0.75rem;
      color: var(--muted);
      font-weight: 500;
      margin-left: 8px;
      letter-spacing: 0.3px;
    }
    .header-right { display: flex; align-items: center; gap: 10px; }
    .admin-badge {
      background: rgba(0,184,169,0.14);
      color: var(--accent-light);
      padding: 3px 10px;
      border-radius: var(--radius);
      font-size: 0.72rem;
      font-weight: 600;
    }

    /* Nav */
    .admin-nav {
      display: flex;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .admin-nav::-webkit-scrollbar { display: none; }
    .nav-tab {
      padding: 10px 14px;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
    }
    .nav-tab:hover { color: var(--text); background: rgba(255,255,255,0.03); }
    .nav-tab.active {
      color: var(--accent-light);
      border-bottom-color: var(--accent);
      background: rgba(0,184,169,0.08);
    }
    .nav-tab i { margin-right: 5px; }

    main { flex: 1; padding: 14px 16px; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
    }
    .card h2 {
      font-size: 0.95rem;
      font-weight: 500;
      margin-bottom: 12px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 7px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 10px;
      text-align: center;
    }
    .stat-card .value { font-size: 1.4rem; font-weight: 700; color: var(--accent-light); }

    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
    th {
      text-align: left;
      padding: 7px 8px;
      color: var(--muted);
      font-weight: 500;
      border-bottom: 1px solid var(--border);
      font-size: 0.72rem;
      white-space: nowrap;
    }
    td { padding: 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tr:hover td { background: rgba(255,255,255,0.02); }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 7px 12px;
      border: none;
      border-radius: var(--radius);
      font-size: 0.78rem;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
    }
    .btn-sm { padding: 5px 9px; font-size: 0.72rem; }
    .btn-primary { background: var(--accent); color: #041210; }
    .btn-primary:hover { background: #00a396; }
    .btn-success { background: var(--success); color: #041210; }
    .btn-success:hover { background: #32c47e; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-danger:hover { background: #e05c63; }
    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { background: var(--card-hover); color: var(--text); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    input, select, textarea {
      width: 100%;
      padding: 8px 10px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.82rem;
      font-family: inherit;
      margin-bottom: 10px;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
    label {
      display: block;
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 3px;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    @media (max-width: 600px) {
      .form-row { grid-template-columns: 1fr; }
    }

    .badge {
      display: inline-block;
      padding: 2px 7px;
      border-radius: var(--radius);
      font-size: 0.65rem;
      font-weight: 500;
      text-transform: uppercase;
    }
    .badge-pending { background: rgba(232,168,56,0.2); color: var(--warning); }
    .badge-sent { background: rgba(61,214,140,0.2); color: var(--success); }
    .badge-unsent { background: rgba(240,113,120,0.2); color: var(--danger); }
    .badge-rejected { background: rgba(139,148,158,0.2); color: var(--muted); }

    .alert {
      padding: 8px 11px;
      border-radius: var(--radius);
      font-size: 0.78rem;
      margin-bottom: 12px;
    }
    .alert-success { background: rgba(61,214,140,0.12); color: #81c995; border: 1px solid rgba(61,214,140,0.25); }
    .alert-error { background: rgba(240,113,120,0.12); color: #f28b82; border: 1px solid rgba(240,113,120,0.25); }
    .alert-info { background: rgba(0,184,169,0.12); color: var(--accent-light); border: 1px solid rgba(0,184,169,0.25); }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 28px 14px;
      font-size: 0.82rem;
    }
    .action-btns { display: flex; gap: 5px; flex-wrap: wrap; }
    .search-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .search-bar input { margin-bottom: 0; flex: 1; }

    code {
      background: var(--bg);
      padding: 1px 5px;
      border-radius: 2px;
      font-size: 0.85em;
      color: var(--accent-light);
    }
