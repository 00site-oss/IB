<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RewardBux · Admin</title>
  <meta name="theme-color" content="#0b1229" />
  <link rel="icon" href="https://i.imgur.com/wppiqAy.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    :root {
      --bg: #0c0f12;
      --bg-secondary: #151a1f;
      --card: #171c22;
      --card-hover: #1e252d;
      --border: #2c353f;
      --text: #d8dde3;
      --muted: #8b949e;
      --accent: #00b8a9;
      --accent-2: #e8a838;
      --accent-light: #5eead4;
      --success: #3dd68c;
      --danger: #f07178;
      --warning: #e8a838;
      --radius: 3px;
      --shadow: inset 0 1px 0 rgba(255,255,255,0.04), 0 1px 2px rgba(0,0,0,0.4);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Roboto', sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.4;
      min-height: 100vh;
    }
    .app { max-width: 1400px; margin:0 auto; padding:12px 16px; }
    /* header */
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      padding: 10px 18px;
      border-radius: var(--radius);
      margin-bottom: 18px;
    }
    .admin-header h1 {
      font-size: 1.2rem;
      font-weight: 500;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .admin-header h1 i { color: var(--accent); }
    .admin-header .badge-admin {
      background: var(--accent);
      color: #041210;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 12px;
      margin-left: 8px;
    }
    .admin-header .user-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 0.85rem;
    }
    .admin-header .user-badge strong { color: #fff; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 6px 14px;
      border: none;
      border-radius: var(--radius);
      font-size: 0.8rem;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.1s;
    }
    .btn-primary { background: var(--accent); color: #041210; }
    .btn-primary:hover { background: #00a396; }
    .btn-success { background: var(--success); color: #fff; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    .btn-ghost:hover { background: var(--card-hover); color: var(--text); }
    .btn-sm { padding: 4px 10px; font-size: 0.7rem; }

    .panel-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 800px) { .panel-grid { grid-template-columns: 1fr; } }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 12px;
    }
    .card h3 {
      font-size: 0.95rem;
      font-weight: 500;
      color: #fff;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card h3 i { color: var(--accent); width: 20px; }

    .stat-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .stat-box {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 14px;
      flex: 1;
      min-width: 100px;
    }
    .stat-box .label { font-size: 0.65rem; color: var(--muted); text-transform: uppercase; }
    .stat-box .value { font-size: 1.1rem; font-weight: 600; color: var(--accent-light); }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
    }
    th {
      text-align: left;
      padding: 6px 4px;
      color: var(--muted);
      font-weight: 500;
      border-bottom: 1px solid var(--border);
    }
    td {
      padding: 6px 4px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    .badge {
      display: inline-block;
      padding: 1px 8px;
      border-radius: 12px;
      font-size: 0.6rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    .badge-unsent { background: rgba(234,67,53,0.2); color: #f28b82; }
    .badge-sent { background: rgba(52,168,83,0.2); color: #81c995; }
    .badge-pending { background: rgba(251,188,4,0.2); color: #fbbc04; }
    .badge-admin { background: var(--accent); color: #041210; }

    .flex { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .flex-between { display: flex; justify-content: space-between; align-items: center; }
    .mb-1 { margin-bottom: 8px; }
    .mt-1 { margin-top: 8px; }
    .empty { color: var(--muted); padding: 12px 0; text-align: center; font-size: 0.85rem; }
    .alert {
      padding: 6px 12px;
      border-radius: var(--radius);
      font-size: 0.78rem;
      background: rgba(0,184,169,0.1);
      border: 1px solid rgba(0,184,169,0.2);
      color: var(--accent-light);
    }
    .alert-error { background: rgba(234,67,53,0.1); border-color: rgba(234,67,53,0.2); color: #f28b82; }
    .alert-success { background: rgba(52,168,83,0.1); border-color: rgba(52,168,83,0.2); color: #81c995; }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 12px;
    }
    .modal {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      max-width: 500px;
      width: 100%;
      padding: 20px;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .modal-header h3 { font-size: 1rem; color: #fff; }
    .modal-close { background: none; border: none; color: var(--muted); font-size: 1.2rem; cursor: pointer; }

    input, select, textarea {
      width: 100%;
      padding: 6px 10px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.8rem;
      font-family: inherit;
      margin-bottom: 8px;
    }
    input:focus, select:focus { outline: none; border-color: var(--accent); }
    label { display: block; font-size: 0.7rem; font-weight: 500; color: var(--muted); margin-bottom: 2px; }

    .scroll-table { max-height: 320px; overflow-y: auto; }
    .tab-bar {
      display: flex;
      gap: 4px;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 4px;
    }
    .tab-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 6px 14px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      border-radius: var(--radius);
    }
    .tab-btn.active {
      background: var(--card-hover);
      color: var(--accent-light);
    }
    .tab-btn:hover { color: #fff; }
  </style>
</head>
<body>
<div id="admin-root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;

// ==================== CONFIG ====================
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz7hvPX2foQcm8buIOLHjPOTnboLBuW70sAnhdBZCMfZ7M3wub_dn8VRqTDUW0sldP6jg/exec";
const GOOGLE_CLIENT_ID = "387422659555-oslvljaea4gosav8f7mtvkt43ns4fa6q.apps.googleusercontent.com";

// same storage helpers
const memoryStore = {};
const storage = {
  get(key) { try { return localStorage.getItem(key); } catch (e) { return memoryStore[key] || null; } },
  set(key, val) { try { localStorage.setItem(key, val); } catch (e) { memoryStore[key] = val; } },
  remove(key) { try { localStorage.removeItem(key); } catch (e) { delete memoryStore[key]; } }
};

const PTS_PER_USD = 1000;
function toUSD(pts) { const n = Number(pts); if (!isFinite(n)) return "0.00"; return (n / PTS_PER_USD).toFixed(2); }
function formatUSD(pts) { return "$" + toUSD(pts); }
function toPts(usd) { return Math.round(Number(usd) * PTS_PER_USD); }

async function api(action, params = {}) {
  try {
    const qs = new URLSearchParams({ action, ...params }).toString();
    const res = await fetch(SCRIPT_URL + "?" + qs);
    return await res.json();
  } catch (e) { return { error: "Network error" }; }
}
async function postApi(action, body = {}) {
  try {
    const params = new URLSearchParams();
    params.append("action", action);
    Object.keys(body).forEach(k => params.append(k, body[k]));
    const res = await fetch(SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8" },
      body: params.toString()
    });
    return await res.json();
  } catch (e) { return { error: "Network error" }; }
}

// ---- Admin App ----
function AdminApp() {
  const [tab, setTab] = useState('dashboard');
  const [users, setUsers] = useState([]);
  const [cashouts, setCashouts] = useState([]);
  const [logs, setLogs] = useState([]);
  const [offerwalls, setOfferwalls] = useState([]);
  const [crOrders, setCrOrders] = useState([]); // CryptoRefills orders
  const [msg, setMsg] = useState(null);
  const [loading, setLoading] = useState(false);
  const [modal, setModal] = useState(null); // { type, data }

  // for manual CR fetch
  const [crStatusFilter, setCrStatusFilter] = useState('all');

  const showMsg = (text, type='info') => {
    setMsg({ text, type });
    setTimeout(() => setMsg(null), 4000);
  };

  const loadAll = useCallback(async () => {
    setLoading(true);
    try {
      const [uRes, cRes, lRes, owRes, crRes] = await Promise.all([
        api('adminUsers'),
        api('adminCashouts'),
        api('adminLogs'),
        api('getOfferwalls'),
        api('adminCRCashouts')
      ]);
      if (uRes.users) setUsers(uRes.users);
      if (cRes.cashouts) setCashouts(cRes.cashouts);
      if (lRes.logs) setLogs(lRes.logs);
      if (owRes.offerwalls) setOfferwalls(owRes.offerwalls);
      if (crRes.orders) setCrOrders(crRes.orders);
    } catch (e) { showMsg('Error loading data', 'error'); }
    setLoading(false);
  }, []);

  useEffect(() => { loadAll(); }, [loadAll]);

  // Admin actions
  const updateBalance = async (account, newBalancePts) => {
    if (!account || isNaN(newBalancePts)) return showMsg('Invalid data', 'error');
    const res = await postApi('adminSetBalance', { account, balance: newBalancePts });
    if (res.error) return showMsg(res.error, 'error');
    showMsg(`Balance updated for ${account}`, 'success');
    loadAll();
  };

  const markCashoutSent = async (cashoutId) => {
    const res = await postApi('adminMarkSent', { id: cashoutId });
    if (res.error) return showMsg(res.error, 'error');
    showMsg('Cashout marked as sent', 'success');
    loadAll();
  };

  const deleteCashout = async (cashoutId) => {
    if (!confirm('Delete this cashout?')) return;
    const res = await postApi('adminDeleteCashout', { id: cashoutId });
    if (res.error) return showMsg(res.error, 'error');
    showMsg('Cashout deleted', 'success');
    loadAll();
  };

  const updateCRStatus = async (orderId, status) => {
    const res = await postApi('adminUpdateCRStatus', { orderId, status });
    if (res.error) return showMsg(res.error, 'error');
    showMsg(`CR order ${orderId} → ${status}`, 'success');
    loadAll();
  };

  const refreshCRStatuses = async () => {
    setLoading(true);
    const res = await api('adminRefreshCR');
    setLoading(false);
    if (res.error) return showMsg(res.error, 'error');
    showMsg(`Refreshed ${res.updated || 0} orders`, 'success');
    loadAll();
  };

  // render helpers
  const statusBadge = (s) => {
    const st = String(s || 'unsent').toLowerCase();
    if (st === 'sent') return <span className="badge badge-sent">Sent</span>;
    if (st === 'pending') return <span className="badge badge-pending">Pending</span>;
    return <span className="badge badge-unsent">Unsent</span>;
  };

  const totalBalance = users.reduce((acc, u) => acc + Number(u.balance || 0), 0);

  return (
    <div className="app">
      {/* header */}
      <div className="admin-header">
        <h1><i className="fas fa-shield-alt" /> RewardBux Admin <span className="badge-admin">v2</span></h1>
        <div className="user-badge">
          <i className="fas fa-database" /> {users.length} users · {formatUSD(totalBalance)} total
          <button className="btn btn-ghost btn-sm" onClick={loadAll}><i className="fas fa-sync" /></button>
          <button className="btn btn-danger btn-sm" onClick={() => { storage.remove('buxiq_user'); window.location.reload(); }}>Logout</button>
        </div>
      </div>

      {msg && <div className={`alert ${msg.type === 'error' ? 'alert-error' : 'alert-success'}`}>{msg.text}</div>}

      {/* tabs */}
      <div className="tab-bar">
        {['dashboard','users','cashouts','cryptorefills','offerwalls','logs'].map(t => (
          <button key={t} className={`tab-btn ${tab === t ? 'active' : ''}`} onClick={() => setTab(t)}>
            {t === 'dashboard' && <><i className="fas fa-chart-pie" /> Overview</>}
            {t === 'users' && <><i className="fas fa-users" /> Users</>}
            {t === 'cashouts' && <><i className="fas fa-hand-holding-usd" /> Cashouts</>}
            {t === 'cryptorefills' && <><i className="fas fa-gift" /> CryptoRefills</>}
            {t === 'offerwalls' && <><i className="fas fa-ad" /> Offerwalls</>}
            {t === 'logs' && <><i className="fas fa-history" /> Logs</>}
          </button>
        ))}
      </div>

      {/* DASHBOARD */}
      {tab === 'dashboard' && (
        <div className="card">
          <h3><i className="fas fa-chart-simple" /> Overview</h3>
          <div className="stat-row">
            <div className="stat-box"><div className="label">Users</div><div className="value">{users.length}</div></div>
            <div className="stat-box"><div className="label">Total Balance (USD)</div><div className="value">{formatUSD(totalBalance)}</div></div>
            <div className="stat-box"><div className="label">Cashouts</div><div className="value">{cashouts.length}</div></div>
            <div className="stat-box"><div className="label">CR Orders</div><div className="value">{crOrders.length}</div></div>
          </div>
          <div className="flex mt-1">
            <button className="btn btn-primary btn-sm" onClick={loadAll}><i className="fas fa-sync" /> Refresh all</button>
            <button className="btn btn-ghost btn-sm" onClick={refreshCRStatuses}><i className="fas fa-sync" /> Refresh CR statuses</button>
          </div>
          <div style={{ marginTop: 12, fontSize: '0.8rem', color: 'var(--muted)' }}>
            <i className="fas fa-circle-check" style={{color:'var(--success)'}} /> Last loaded: {new Date().toLocaleTimeString()}
          </div>
        </div>
      )}

      {/* USERS */}
      {tab === 'users' && (
        <div className="card">
          <h3><i className="fas fa-users" /> Users ({users.length})</h3>
          <div className="scroll-table">
            <table>
              <thead><tr><th>Account</th><th>Username</th><th>Balance (pts)</th><th>Level</th><th>Actions</th></tr></thead>
              <tbody>
                {users.map(u => (
                  <tr key={u.account}>
                    <td>{u.account}</td>
                    <td>{u.username || '—'}</td>
                    <td>{Number(u.balance || 0).toLocaleString()} ({formatUSD(u.balance)})</td>
                    <td>{u.level || 1}</td>
                    <td>
                      <button className="btn btn-primary btn-sm" onClick={() => setModal({ type: 'editBalance', data: u })}>
                        <i className="fas fa-pen" />
                      </button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {/* CASHOUTS */}
      {tab === 'cashouts' && (
        <div className="card">
          <h3><i className="fas fa-hand-holding-usd" /> Cashouts ({cashouts.length})</h3>
          <div className="scroll-table">
            <table>
              <thead><tr><th>User</th><th>Reward</th><th>Amount</th><th>Details</th><th>Status</th><th>Actions</th></tr></thead>
              <tbody>
                {cashouts.map(c => (
                  <tr key={c.id}>
                    <td>{c.username || c.account}</td>
                    <td>{c.rewardName || c.rewardType}</td>
                    <td>{formatUSD(c.amount)}</td>
                    <td style={{maxWidth:120, wordBreak:'break-all'}}>{c.details || '—'}</td>
                    <td>{statusBadge(c.status)}</td>
                    <td>
                      <div className="flex">
                        {String(c.status).toLowerCase() !== 'sent' && (
                          <button className="btn btn-success btn-sm" onClick={() => markCashoutSent(c.id)}>Sent</button>
                        )}
                        <button className="btn btn-danger btn-sm" onClick={() => deleteCashout(c.id)}><i className="fas fa-trash" /></button>
                      </div>
                    </td>
                  </tr>
                ))}
                {cashouts.length === 0 && <tr><td colSpan="6" className="empty">No cashouts</td></tr>}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {/* CRYPTOREFILLS */}
      {tab === 'cryptorefills' && (
        <div className="card">
          <h3><i className="fas fa-gift" /> CryptoRefills Orders ({crOrders.length})</h3>
          <div className="flex mb-1">
            <button className="btn btn-primary btn-sm" onClick={refreshCRStatuses}><i className="fas fa-sync" /> Refresh statuses</button>
            <select value={crStatusFilter} onChange={e => setCrStatusFilter(e.target.value)} style={{ width: 'auto', marginBottom:0 }}>
              <option value="all">All</option>
              <option value="pending">Pending</option>
              <option value="sent">Sent</option>
              <option value="unsent">Unsent</option>
            </select>
          </div>
          <div className="scroll-table">
            <table>
              <thead><tr><th>Order ID</th><th>User</th><th>Brand</th><th>Amount</th><th>Email</th><th>Status</th><th>Actions</th></tr></thead>
              <tbody>
                {crOrders.filter(o => crStatusFilter === 'all' || String(o.status).toLowerCase() === crStatusFilter).map(o => (
                  <tr key={o.id}>
                    <td style={{fontSize:'0.7rem'}}>{o.crOrderId || o.id}</td>
                    <td>{o.username || o.account}</td>
                    <td>{o.brand_name || '—'}</td>
                    <td>{formatUSD(o.amount)}</td>
                    <td style={{maxWidth:100, wordBreak:'break-all'}}>{o.email || o.details}</td>
                    <td>{statusBadge(o.status)}</td>
                    <td>
                      <div className="flex">
                        {String(o.status).toLowerCase() !== 'sent' && (
                          <button className="btn btn-success btn-sm" onClick={() => updateCRStatus(o.id, 'sent')}>Sent</button>
                        )}
                        {String(o.status).toLowerCase() !== 'pending' && (
                          <button className="btn btn-ghost btn-sm" onClick={() => updateCRStatus(o.id, 'pending')}>Pending</button>
                        )}
                      </div>
                    </td>
                  </tr>
                ))}
                {crOrders.length === 0 && <tr><td colSpan="7" className="empty">No CR orders</td></tr>}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {/* OFFERWALLS */}
      {tab === 'offerwalls' && (
        <div className="card">
          <h3><i className="fas fa-ad" /> Offerwalls</h3>
          <button className="btn btn-primary btn-sm mb-1" onClick={() => setModal({ type: 'addOfferwall' })}>
            <i className="fas fa-plus" /> Add offerwall
          </button>
          <div className="scroll-table">
            <table>
              <thead><tr><th>ID</th><th>Name</th><th>URL Template</th><th>Logo</th><th>Actions</th></tr></thead>
              <tbody>
                {offerwalls.map(o => (
                  <tr key={o.id}>
                    <td>{o.id}</td>
                    <td>{o.name}</td>
                    <td style={{maxWidth:150, wordBreak:'break-all', fontSize:'0.7rem'}}>{o.urlTemplate || '—'}</td>
                    <td>{o.logo ? <img src={o.logo} style={{height:20, objectFit:'contain'}} /> : '—'}</td>
                    <td>
                      <button className="btn btn-danger btn-sm" onClick={async () => {
                        if (!confirm('Delete offerwall?')) return;
                        const res = await postApi('adminDeleteOfferwall', { id: o.id });
                        if (res.error) showMsg(res.error, 'error'); else { showMsg('Deleted', 'success'); loadAll(); }
                      }}><i className="fas fa-trash" /></button>
                    </td>
                  </tr>
                ))}
                {offerwalls.length === 0 && <tr><td colSpan="5" className="empty">No offerwalls</td></tr>}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {/* LOGS */}
      {tab === 'logs' && (
        <div className="card">
          <h3><i className="fas fa-history" /> Recent Logs</h3>
          <div className="scroll-table">
            <table>
              <thead><tr><th>User</th><th>Action</th><th>Amount</th><th>Time</th></tr></thead>
              <tbody>
                {logs.slice(0, 100).map((l, i) => (
                  <tr key={i}>
                    <td>{l.username || l.account}</td>
                    <td>{l.action || '—'}</td>
                    <td>{l.amount ? formatUSD(l.amount) : '—'}</td>
                    <td style={{fontSize:'0.7rem'}}>{l.time || '—'}</td>
                  </tr>
                ))}
                {logs.length === 0 && <tr><td colSpan="4" className="empty">No logs</td></tr>}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {/* MODAL: edit balance */}
      {modal && modal.type === 'editBalance' && (
        <EditBalanceModal user={modal.data} onClose={() => setModal(null)} onSave={updateBalance} />
      )}

      {/* MODAL: add offerwall */}
      {modal && modal.type === 'addOfferwall' && (
        <AddOfferwallModal onClose={() => setModal(null)} onSaved={() => { loadAll(); setModal(null); }} />
      )}
    </div>
  );
}

// ---- MODAL: Edit Balance ----
function EditBalanceModal({ user, onClose, onSave }) {
  const [pts, setPts] = useState(String(user.balance || 0));
  const [loading, setLoading] = useState(false);
  const handleSave = async () => {
    const val = parseInt(pts);
    if (isNaN(val) || val < 0) return alert('Enter a valid positive number');
    setLoading(true);
    await onSave(user.account, val);
    setLoading(false);
    onClose();
  };
  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal">
        <div className="modal-header">
          <h3>Edit Balance: {user.username || user.account}</h3>
          <button className="modal-close" onClick={onClose}><i className="fas fa-times" /></button>
        </div>
        <label>Points (1 USD = {PTS_PER_USD} pts)</label>
        <input type="number" value={pts} onChange={e => setPts(e.target.value)} />
        <div style={{ fontSize: '0.8rem', color: 'var(--muted)' }}>≈ {formatUSD(pts)}</div>
        <div className="flex" style={{ marginTop: 12 }}>
          <button className="btn btn-primary" onClick={handleSave} disabled={loading}>Save</button>
          <button className="btn btn-ghost" onClick={onClose}>Cancel</button>
        </div>
      </div>
    </div>
  );
}

// ---- MODAL: Add Offerwall ----
function AddOfferwallModal({ onClose, onSaved }) {
  const [name, setName] = useState('');
  const [urlTemplate, setUrlTemplate] = useState('');
  const [logo, setLogo] = useState('');
  const [loading, setLoading] = useState(false);
  const handleSave = async () => {
    if (!name.trim() || !urlTemplate.trim()) return alert('Name and URL required');
    setLoading(true);
    const res = await postApi('adminAddOfferwall', { name, urlTemplate, logo });
    setLoading(false);
    if (res.error) return alert(res.error);
    onSaved();
  };
  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal">
        <div className="modal-header">
          <h3>Add Offerwall</h3>
          <button className="modal-close" onClick={onClose}><i className="fas fa-times" /></button>
        </div>
        <label>Name</label>
        <input value={name} onChange={e => setName(e.target.value)} placeholder="e.g. Offerwall X" />
        <label>URL Template</label>
        <input value={urlTemplate} onChange={e => setUrlTemplate(e.target.value)} placeholder="https://example.com?user={userid}" />
        <label>Logo URL (optional)</label>
        <input value={logo} onChange={e => setLogo(e.target.value)} placeholder="https://..." />
        <div className="flex" style={{ marginTop: 12 }}>
          <button className="btn btn-primary" onClick={handleSave} disabled={loading}>Add</button>
          <button className="btn btn-ghost" onClick={onClose}>Cancel</button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('admin-root')).render(<AdminApp />);
</script>
</body>
</html>
