  <style>
    :root {
  /* Background */
  --bg: #050816;
  --bg-secondary: #0b1120;

  /* Cards */
  --card: rgba(18, 24, 45, 0.72);
  --card-hover: rgba(25, 33, 60, 0.9);
  --border: rgba(255,255,255,.08);

  /* Text */
  --text: #f8fafc;
  --muted: #94a3b8;

  /* Accent */
  --accent: #5b8cff;
  --accent-2: #7c5cff;
  --accent-light: #8cb8ff;

  /* Status */
  --success: #22c55e;
  --danger: #ef4444;
  --warning: #f59e0b;

  /* Effects */
  --radius: 22px;
  --shadow:
    0 10px 30px rgba(0,0,0,.35),
    0 0 0 1px rgba(255,255,255,.03);

  --blur: blur(18px);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at top left,#4f46e515 0%,transparent 35%),
    radial-gradient(circle at top right,#3b82f620 0%,transparent 30%),
    radial-gradient(circle at bottom,#7c5cff15 0%,transparent 45%),
    linear-gradient(180deg,#060b19 0%,#090f1d 45%,#050816 100%);
  min-height:100vh;
  line-height:1.6;
  font-size:15px;
  letter-spacing:.01em;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overflow-x:hidden;
}

.app{
  position:relative;
  max-width:500px;
  margin:auto;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  padding:24px 18px 90px;

  background:
    radial-gradient(700px 350px at 50% -10%,rgba(91,140,255,.18),transparent),
    radial-gradient(500px 250px at 100% 100%,rgba(124,92,255,.12),transparent);

  backdrop-filter:var(--blur);
}

/* Optional reusable card style */

.card{
  background:var(--card);
  backdrop-filter:var(--blur);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  transition:.25s ease;
}

.card:hover{
  background:var(--card-hover);
  transform:translateY(-3px);
  border-color:rgba(91,140,255,.35);
  box-shadow:
    0 20px 45px rgba(0,0,0,.4),
    0 0 0 1px rgba(91,140,255,.2);
}

    /* Header */

<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef, useCallback } = React;

    /* ====== CONFIG ====== */
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz7hvPX2foQcm8buIOLHjPOTnboLBuW70sAnhdBZCMfZ7M3wub_dn8VRqTDUW0sldP6jg/exec";
    const GOOGLE_CLIENT_ID = "387422659555-oslvljaea4gosav8f7mtvkt43ns4fa6q.apps.googleusercontent.com";

    const memoryStore = {};
    const storage = {
      get(key) { try { return localStorage.getItem(key); } catch (e) { return memoryStore[key] || null; } },
      set(key, val) { try { localStorage.setItem(key, val); } catch (e) { memoryStore[key] = val; } },
      remove(key) { try { localStorage.removeItem(key); } catch (e) { delete memoryStore[key]; } }
    };

    const REWARDS = [
      {
        id: "amazon_uk",
        name: "Amazon.co.uk",
        min: 1,
        logo: "https://upload.wikimedia.org/wikipedia/commons/a/a9/Amazon_logo.svg",
        detailsLabel: "Amazon.co.uk Gift Card Email",
        detailsPlaceholder: "you@email.com"
      }
    ];

    let audioCtx = null;
    function playDing() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.type = "sine";
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
        osc.start(); osc.stop(audioCtx.currentTime + 0.35);
      } catch (e) {}
    }

    async function api(action, params = {}) {
      try {
        const qs = new URLSearchParams(Object.assign({ action }, params)).toString();
        const res = await fetch(SCRIPT_URL + "?" + qs);
        return await res.json();
      } catch (e) {
        return { error: "Network error" };
      }
    }

    async function postApi(action, body = {}) {
      try {
        const params = new URLSearchParams();
        params.append("action", action);
        Object.keys(body).forEach(k => params.append(k, body[k]));
        const res = await fetch(SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8" },
          body: params.toString()
        });
        return await res.json();
      } catch (e) {
        return { error: "Network error" };
      }
    }

    function App() {
      const [tab, setTab] = useState("home");
      const [user, setUser] = useState(null);
      const [logs, setLogs] = useState([]);
      const [leaders, setLeaders] = useState([]);
      const [iframeUrl, setIframeUrl] = useState(null);
      const [msg, setMsg] = useState(null);
      const [captcha, setCaptcha] = useState("");
      const [form, setForm] = useState({ account: "", clientId: "", captcha: "", username: "", bonusCode: "" });
      const [offerwalls, setOfferwalls] = useState([]);
      const [owLoading, setOwLoading] = useState(true);
      const [chatMessages, setChatMessages] = useState([]);
      const [chatInput, setChatInput] = useState("");
      const [soundOn, setSoundOn] = useState(true);
      const lastMsgId = useRef(null);
      const chatEndRef = useRef(null);
      const pollRef = useRef(null);
      const soundRef = useRef(true);
      const userRef = useRef(null);
      const gInited = useRef(false);
      const [cashouts, setCashouts] = useState([]);
      const [modal, setModal] = useState(null);
      const [step, setStep] = useState(1);
      const [amount, setAmount] = useState("");
      const [details, setDetails] = useState("");
      const [submitting, setSubmitting] = useState(false);
      const [loggingIn, setLoggingIn] = useState(false);

      useEffect(() => { soundRef.current = soundOn; }, [soundOn]);
      useEffect(() => { userRef.current = user; }, [user]);

      function showMsg(text, type = "error") {
        setMsg({ text, type });
        setTimeout(() => setMsg(null), 4000);
      }
      function genCaptcha() { setCaptcha(String(Math.floor(10000 + Math.random() * 90000))); }
      function saveUser(u) {
        setUser(u);
        userRef.current = u;
        storage.set("buxiq_user", JSON.stringify(u));
      }
      function logout() {
        setUser(null);
        storage.remove("buxiq_user");
        try { if (window.google) window.google.accounts.id.disableAutoSelect(); } catch (e) {}
        gInited.current = false;
        setTab("home");
        showMsg("Logged out", "success");
      }
      function toggleSound() {
        const next = !soundOn;
        setSoundOn(next);
        storage.set("buxiq_sound", next ? "1" : "0");
      }

      const loadLogs = useCallback(async () => {
        const data = await api("logs");
        if (data.logs) setLogs(data.logs);
      }, []);
      const loadLeaders = useCallback(async () => {
        const data = await api("leaders");
        if (data.leaders) setLeaders(data.leaders);
      }, []);
      const loadOfferwalls = useCallback(async () => {
        setOwLoading(true);
        const data = await api("getOfferwalls");
        setOfferwalls(Array.isArray(data.offerwalls) ? data.offerwalls : []);
        setOwLoading(false);
      }, []);
      const refreshBalance = useCallback(async () => {
        const u = userRef.current;
        if (!u) return;
        const data = await api("balance", { account: u.account });
        if (data.balance !== undefined) saveUser({ ...u, balance: data.balance, level: data.level || u.level });
      }, []);
      const loadCashouts = useCallback(async (account) => {
        const data = await api("getCashouts", { account });
        setCashouts(data.cashouts || []);
      }, []);
      const loadChat = useCallback(async (isInitial) => {
        const data = await api("getChat", { limit: 50 });
        if (!data.messages) return;
        const msgs = data.messages;
        const newestId = msgs.length ? msgs[msgs.length - 1].id : null;
        if (!isInitial && newestId && lastMsgId.current && newestId !== lastMsgId.current && soundRef.current) playDing();
        lastMsgId.current = newestId;
        setChatMessages(msgs);
      }, []);

      const creditEarnings = useCallback(async (userId, amt, txnId) => {
        const data = await postApi("creditEarnings", {
          userId, amount: amt, transactionId: txnId || String(Date.now())
        });
        if (data.error) { showMsg("Credit failed: " + data.error); return; }
        showMsg("$" + Number(amt).toFixed(2) + " credited!", "success");
        const u = userRef.current;
        if (u && (String(u.account) === String(userId) || u.username === userId)) refreshBalance();
        loadLogs(); loadLeaders();
        if (soundRef.current) playDing();
      }, [refreshBalance, loadLogs, loadLeaders]);

      const handleGoogleCredential = useCallback((response) => {
        if (!response || !response.credential) { showMsg("Google login failed"); return; }
        let payload;
        try {
          payload = JSON.parse(decodeURIComponent(escape(atob(response.credential.split(".")[1].replace(/-/g, "+").replace(/_/g, "/")))));
        } catch (e) { showMsg("Could not read Google account"); return; }
        setLoggingIn(true);
        postApi("googleLogin", {
          googleId: payload.sub,
          email: payload.email,
          name: payload.name || "",
          picture: payload.picture || ""
        }).then(data => {
          setLoggingIn(false);
          if (data.error) { showMsg(data.error); return; }
          saveUser(data.user);
          setTab("earn");
          showMsg(data.isNew ? "Account created! Welcome!" : "Welcome back!", "success");
        });
      }, []);

      useEffect(() => {
        if (user) return;
        let tries = 0;
        const timer = setInterval(() => {
          tries++;
          const el = document.getElementById("gbtn");
          const g = window.google && window.google.accounts && window.google.accounts.id;
          if (g && el) {
            clearInterval(timer);
            try {
              if (!gInited.current) {
                g.initialize({ client_id: GOOGLE_CLIENT_ID, callback: handleGoogleCredential, cancel_on_tap_outside: true });
                gInited.current = true;
              }
              el.innerHTML = "";
              g.renderButton(el, { theme: "filled_blue", size: "large", width: 320, text: "continue_with", shape: "pill", logo_alignment: "left" });
            } catch (e) {}
          } else if (tries > 40) clearInterval(timer);
        }, 250);
        return () => clearInterval(timer);
      }, [tab, user, handleGoogleCredential]);

      useEffect(() => {
        const saved = storage.get("buxiq_user");
        if (saved) { try { const u = JSON.parse(saved); setUser(u); userRef.current = u; } catch (e) {} }
        const soundPref = storage.get("buxiq_sound");
        if (soundPref !== null) { setSoundOn(soundPref === "1"); soundRef.current = soundPref === "1"; }
        genCaptcha();
        loadLeaders(); loadLogs(); loadOfferwalls();
        const p = new URLSearchParams(window.location.search);
        const uid = p.get("user_id") || p.get("userid");
        const amt = p.get("amount") || p.get("reward");
        const txn = p.get("transaction_id") || p.get("txn_id");
        if (uid && amt && !isNaN(parseFloat(amt))) {
          creditEarnings(uid, parseFloat(amt), txn);
          window.history.replaceState({}, document.title, window.location.pathname);
        }
      }, []);

      useEffect(() => {
        if (tab === "chat") {
          loadChat(true);
          pollRef.current = setInterval(() => loadChat(false), 4000);
        }
        return () => clearInterval(pollRef.current);
      }, [tab, loadChat]);
      useEffect(() => { if (tab === "shop" && user) loadCashouts(user.account); }, [tab, user, loadCashouts]);
      useEffect(() => { if (tab === "earn") loadOfferwalls(); }, [tab, loadOfferwalls]);
      useEffect(() => { if (chatEndRef.current) chatEndRef.current.scrollIntoView({ behavior: "smooth" }); }, [chatMessages]);

      async function handleLogin() {
        if (!form.account || !form.clientId) { showMsg("Enter account and client ID"); return; }
        if (form.captcha.trim() !== captcha) { showMsg("Invalid CAPTCHA"); genCaptcha(); setForm({...form, captcha: ""}); return; }
        setLoggingIn(true);
        const data = await api("login", { account: form.account, clientId: form.clientId });
        setLoggingIn(false);
        if (data.error) { showMsg(data.error); genCaptcha(); return; }
        saveUser(data.user);
        setTab("earn");
        showMsg("Welcome back!", "success");
      }

      async function sendChat() {
        const text = chatInput.trim();
        if (!text) return;
        if (!user) { showMsg("Please login to chat"); setTab("earn"); return; }
        if (text.length > 300) { showMsg("Message too long (max 300)"); return; }
        setChatInput("");
        const data = await postApi("sendChat", {
          account: user.account, username: user.username || user.account, message: text
        });
        if (data.error) { showMsg(data.error); return; }
        loadChat(false);
      }

      function openModal(reward) {
        if (!user) { showMsg("Please login first"); setTab("earn"); return; }
        setModal(reward); setStep(1); setAmount(""); setDetails("");
      }
      function closeModal() { setModal(null); setStep(1); setAmount(""); setDetails(""); }

      function nextStep() {
        const bal = parseFloat((user && user.balance) || 0);
        const amt = parseFloat(amount);
        if (step === 1) {
          if (!amount || isNaN(amt) || amt <= 0) { showMsg("Enter a valid amount"); return; }
          if (amt < modal.min) { showMsg("Minimum is $" + modal.min); return; }
          if (amt > bal) { showMsg("Insufficient balance"); return; }
          setStep(2);
        } else if (step === 2) {
          if (!details.trim()) { showMsg("Enter receiving details"); return; }
          setStep(3);
        }
      }

      async function submitCashout() {
        setSubmitting(true);
        const data = await postApi("submitCashout", {
          account: user.account,
          username: user.username || user.account,
          rewardType: modal.id,
          rewardName: modal.name,
          amount,
          details: details.trim()
        });
        setSubmitting(false);
        if (data.error) { showMsg(data.error); return; }
        showMsg("Cashout submitted!", "success");
        const newBal = data.newBalance !== undefined ? data.newBalance : (parseFloat(user.balance) - parseFloat(amount));
        saveUser({ ...user, balance: parseFloat(newBal).toFixed(2) });
        loadCashouts(user.account);
        closeModal();
      }

      function statusBadge(status) {
        const s = String(status || "unsent").toLowerCase();
        if (s === "sent") return <span className="badge badge-sent">Sent</span>;
        if (s === "pending") return <span className="badge badge-pending">Pending</span>;
        return <span className="badge badge-unsent">Unsent</span>;
      }

      async function redeemBonus() {
        if (!user) {
          showMsg("Please login first", "error");
          setTab("earn");
          return;
        }
        const code = (form.bonusCode || "").trim();
        if (!code) {
          showMsg("Please enter a bonus code", "error");
          return;
        }
        const data = await api("redeemBonus", {
          account: user.account,
          username: user.username || user.account,
          bonusCode: code
        });
        if (data.error) {
          showMsg(data.error, "error");
          return;
        }
        showMsg("Successfully redeemed $" + data.amountUsd + "!", "success");
        setForm(f => ({ ...f, bonusCode: "" }));
        if (data.newBalance) {
          saveUser({ ...user, balance: data.newBalance });
        } else {
          refreshBalance();
        }
      }

      function openOffer(ow) {
        if (!user) { showMsg("Please login first"); setTab("earn"); return; }
        const uid = String(user.account || user.username || "");
        const uname = String(user.username || uid);
        let url = String(ow.urlTemplate || "");
        if (!url) { showMsg("Offerwall URL missing"); return; }
        url = url
          .replace(/\{user\}/gi, encodeURIComponent(uid))
          .replace(/\{userid\}/gi, encodeURIComponent(uid))
          .replace(/\{user_id\}/gi, encodeURIComponent(uid))
          .replace(/\{account\}/gi, encodeURIComponent(uid))
          .replace(/\{username\}/gi, encodeURIComponent(uname))
          .replace(/\$\{userid\}/gi, encodeURIComponent(uid))
          .replace(/\$\{account\}/gi, encodeURIComponent(uid))
          .replace(/\$\{username\}/gi, encodeURIComponent(uname));
        url += (url.indexOf("?") !== -1 ? "&" : "?") + "t=" + Date.now();
        setIframeUrl(url);
      }

      const tabs = [
        { id: "home", icon: "fa-home", label: "Home" },
        { id: "earn", icon: "fa-hand-holding-dollar", label: "Earn" },
        { id: "shop", icon: "fa-shopping-cart", label: "Shop" },
        { id: "leaders", icon: "fa-trophy", label: "Leaders" },
        { id: "chat", icon: "fa-comments", label: "Chat" },
        { id: "bonus", icon: "fa-gift", label: "Bonus" },
        { id: "help", icon: "fa-circle-question", label: "Help" }
      ];

      return (
        <div className="app">
          {/* HEADER */}
          <div className="top-header">
            <div className="logo-row">
              <div className="logo">
                <span className="dollar">$</span>Reward<span>Bux</span>
              </div>
            </div>

            <div className="user-bar">
              {user ? (
                <>
                  <div className="user-left">
                    <div className="avatar-wrap">
                      <img 
                        src={user.avatar || ("https://ui-avatars.com/api/?name=" + encodeURIComponent(user.username || "U") + "&background=3b82f6&color=fff")} 
                        alt="" 
                      />
                      <div className="level-badge">{user.level || 1}</div>
                    </div>
                    <div className="user-meta">
                      <div className="name">{user.username || user.account || "User"}</div>
                      <div className="balance-row">
                        <span className="diamond"><i className="fas fa-gem"></i></span>
                        <span className="amount">${parseFloat(user.balance || 0).toFixed(2)}</span>
                      </div>
                    </div>
                  </div>
                  <div className="user-actions">
                    <button className="icon-btn logout" onClick={logout} title="Logout">
                      <i className="fas fa-sign-out-alt"></i>
                    </button>
                  </div>
                </>
              ) : (
                <div style={{ width: "100%", display: "flex", justifyContent: "center" }}>
                  <button className="btn btn-primary" style={{ width: "auto", padding: "8px 20px" }} onClick={() => setTab("earn")}>
                    Signup / Login
                  </button>
                </div>
              )}
            </div>

            {/* Static Logs Bar */}
            {logs.length > 0 && (
              <div className="logs-bar">
                <div className="logs-row">
                  {logs.slice(0, 15).map((l, i) => (
                    <div key={i} className="log-card">
                      <img 
                        src={"https://ui-avatars.com/api/?name=" + encodeURIComponent(l.username || "U") + "&background=3b82f6&color=fff&size=64"} 
                        alt="" 
                      />
                      <div className="info">
                        <span className="uname">{l.username}</span>
                        <span className="amount">{parseFloat(l.amount || 0).toFixed(2)}</span>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>

          <main>
            {msg && <div className={"alert alert-" + msg.type}>{msg.text}</div>}

            {tab === "home" && (
              <>
                <div className="hero">
                  <h1>Earn free crypto, Paypal, and gift cards</h1>
                  <p>Join thousands of users already earning hundreds of dollars every day!</p>
                </div>

                <div className="feature-grid">
                  <div className="feature-card">
                    <h3>Complete <span>Surveys</span></h3>
                    <div className="icons">
                      <i className="fas fa-clipboard-list"></i>
                      <i className="fas fa-chart-bar"></i>
                    </div>
                  </div>
                  <div className="feature-card">
                    <h3>Download <span>Apps</span></h3>
                    <div className="icons">
                      <i className="fas fa-cloud-download-alt"></i>
                      <i className="fas fa-mobile-alt"></i>
                    </div>
                  </div>
                  <div className="feature-card">
                    <h3>Play <span>Games</span></h3>
                    <div className="icons">
                      <i className="fas fa-keyboard"></i>
                      <i className="fas fa-mouse"></i>
                    </div>
                  </div>
                </div>

                <div style={{ textAlign: 'center', color: 'var(--muted)', fontSize: '0.85rem', margin: '16px 0 10px' }}>
                  – And Cashout Into –
                </div>

                <div className="feature-grid">
                  <div className="feature-card">
                    <h3>Crypto <span>Currencies</span></h3>
                    <div className="icons">
                      <i className="fab fa-bitcoin"></i>
                      <i className="fab fa-ethereum"></i>
                    </div>
                  </div>
                  <div className="feature-card">
                    <h3>Paypal <span>Money</span></h3>
                    <div className="icons">
                      <i className="fab fa-paypal"></i>
                      <i className="fas fa-money-bill-wave"></i>
                    </div>
                  </div>
                  <div className="feature-card">
                    <h3>Gift <span>Cards</span></h3>
                    <div className="icons">
                      <i className="fas fa-gift"></i>
                      <i className="fas fa-credit-card"></i>
                    </div>
                  </div>
                </div>

                {!user && (
                  <button className="btn btn-primary" style={{ marginTop: 18 }} onClick={() => setTab("earn")}>
                    <i className="fas fa-sign-in-alt" /> Login to Start Earning
                  </button>
                )}
              </>
            )}

            {tab === "earn" && (!user ? (
              <div className="card">
                <h2>Login</h2>
                <div id="gbtn" />
                <div className="divider"><span>OR</span></div>
                <label>Account #</label>
                <input value={form.account} onChange={e => setForm({...form, account: e.target.value})} placeholder="Account number" />
                <label>Client ID</label>
                <input value={form.clientId} onChange={e => setForm({...form, clientId: e.target.value})} placeholder="Client ID" />
                <label>CAPTCHA</label>
                <div className="captcha">{captcha}</div>
                <input value={form.captcha} onChange={e => setForm({...form, captcha: e.target.value})}
                  onKeyDown={e => e.key === "Enter" && handleLogin()} placeholder="Enter CAPTCHA" />
                <button className="btn btn-primary" onClick={handleLogin} disabled={loggingIn}>
                  {loggingIn ? "Signing in…" : "Login"}
                </button>
              </div>
            ) : (
              <div className="card">
                <h2>Earning Portal</h2>
                <p style={{ color: "var(--muted)", marginBottom: 16, fontSize: "0.9rem" }}>Complete offers to earn rewards</p>
                {owLoading ? (
                  <div className="empty">Loading offerwalls…</div>
                ) : offerwalls.length === 0 ? (
                  <div className="empty">No offerwalls available.</div>
                ) : (
                  <div className="offer-grid">
                    {offerwalls.map(o => (
                      <div key={o.id} className="offer">
                        {o.logo ? <img src={o.logo} alt={o.name} onError={e => e.target.style.display="none"} /> : null}
                        <div style={{ fontSize: "0.85rem", marginBottom: 10, fontWeight: 500 }}>{o.name}</div>
                        <button className="btn btn-primary" style={{ padding: "8px" }} onClick={() => openOffer(o)}>Open</button>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            ))}

            {tab === "shop" && (
              <>
                <div className="card">
                  <h2>Cashout</h2>
                  <p style={{ color: "var(--muted)", marginBottom: 14, fontSize: "0.875rem" }}>
                    Balance: <strong style={{color:'var(--accent-light)'}}>${parseFloat((user && user.balance) || 0).toFixed(2)}</strong>
                  </p>
                  {!user ? (
                    <button className="btn btn-primary" onClick={() => setTab("earn")}>Login to Cashout</button>
                  ) : (
                    <div className="reward-grid">
                      {REWARDS.map(r => (
                        <div key={r.id} className="reward-item" onClick={() => openModal(r)}>
                          {r.logo ? <img src={r.logo} alt={r.name} onError={e => e.target.style.display="none"} /> : null}
                          <div className="name">{r.name}</div>
                          <div className="min">Min ${r.min}</div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
                {user && (
                  <div className="card">
                    <h2>Your Cashouts</h2>
                    {cashouts.length === 0 ? (
                      <div className="empty">No cashout requests yet</div>
                    ) : cashouts.map((c, i) => (
                      <div key={c.id || i} className="history-item">
                        <div>
                          <div style={{ fontWeight: 600 }}>{c.rewardName || c.rewardType}</div>
                          <div style={{ fontSize: "0.8rem", color: "var(--muted)" }}>
                            ${parseFloat(c.amount || 0).toFixed(2)} · {c.time}
                          </div>
                        </div>
                        {statusBadge(c.status)}
                      </div>
                    ))}
                  </div>
                )}
              </>
            )}

            {tab === "chat" && (
              <div className="card chat-box">
                <h2>Community Chat</h2>
                <div className="chat-sound-toggle" onClick={toggleSound}>
                  <i className={"fas " + (soundOn ? "fa-volume-up" : "fa-volume-mute")} />
                  {soundOn ? "Ding sound ON" : "Ding sound OFF"}
                </div>
                <div className="chat-messages">
                  {chatMessages.length === 0 ? (
                    <div className="empty">No messages yet. Say hi!</div>
                  ) : chatMessages.map(m => (
                    <div key={m.id} className={"chat-msg" + (m.isAdmin ? " admin-msg" : "")}>
                      <div className="meta">
                        <span>
                          <span className="name">{m.username}</span>
                          {m.isAdmin ? <span className="badge-owner"><i className="fas fa-shield-alt" /> Owner</span> : null}
                        </span>
                        <span>{m.time}</span>
                      </div>
                      <div>{m.message}</div>
                    </div>
                  ))}
                  <div ref={chatEndRef} />
                </div>
                <div className="chat-input-row">
                  <input value={chatInput}
                    onChange={e => setChatInput(e.target.value)}
                    onKeyDown={e => e.key === "Enter" && sendChat()}
                    placeholder={user ? "Type a message..." : "Login to chat"}
                    maxLength={300} disabled={!user} />
                  <button className="btn btn-primary" onClick={sendChat} disabled={!user}>
                    <i className="fas fa-paper-plane" />
                  </button>
                </div>
              </div>
            )}

            {tab === "leaders" && (
              <div className="card leaderboard">
                <h2>Leaderboard</h2>
                {leaders.length === 0 ? (
                  <div className="empty">No data yet</div>
                ) : (
                  <table>
                    <thead><tr><th>#</th><th>User</th><th>Earnings</th><th>Lvl</th></tr></thead>
                    <tbody>
                      {leaders.map((l, i) => (
                        <tr key={i}>
                          <td>{i + 1}</td>
                          <td>{l.username}</td>
                          <td>${parseFloat(l.balance || 0).toFixed(2)}</td>
                          <td>{l.level}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                )}
              </div>
            )}

            {tab === "bonus" && (
              <div className="card">
                <h2>Redeem Bonus Code</h2>
                <div className="alert alert-warn">
                  First come, first served. Each code can only be used once.
                </div>

                {!user ? (
                  <button className="btn btn-primary" onClick={() => setTab("earn")}>
                    Login to Redeem Bonus
                  </button>
                ) : (
                  <>
                    <label>Username</label>
                    <input 
                      value={user.username || user.account || ""} 
                      disabled 
                      style={{ opacity: 0.7 }}
                    />
                    <label>Bonus Code</label>
                    <input 
                      value={form.bonusCode} 
                      onChange={e => setForm({...form, bonusCode: e.target.value.toUpperCase()})} 
                      placeholder="Enter code"
                      onKeyDown={e => e.key === "Enter" && redeemBonus()}
                    />
                    <button className="btn btn-primary" onClick={redeemBonus}>
                      Redeem Code
                    </button>
                  </>
                )}
              </div>
            )}

            {tab === "help" && (
              <div className="card">
                <h2>Help & Support</h2>
                <div style={{ marginBottom: 16 }}>
                  <strong>How to earn?</strong>
                  <p style={{ color: "var(--muted)", fontSize: "0.9rem", marginTop: 4 }}>Login → Earn → open an offerwall.</p>
                </div>
                <div style={{ marginBottom: 16 }}>
                  <strong>How to cash out?</strong>
                  <p style={{ color: "var(--muted)", fontSize: "0.9rem", marginTop: 4 }}>Shop → pick a reward → amount → details → submit.</p>
                </div>
                <div style={{ marginBottom: 16 }}>
                  <strong>Cashout status</strong>
                  <p style={{ color: "var(--muted)", fontSize: "0.9rem", marginTop: 4 }}>
                    <span className="badge badge-unsent">Unsent</span> waiting ·
                    <span className="badge badge-sent" style={{ marginLeft: 6 }}>Sent</span> paid
                  </p>
                </div>
                <button className="btn btn-primary" onClick={() => alert("Email support@rewardbux.com")}>
                  Contact Support
                </button>
              </div>
            )}
          </main>

          {/* BOTTOM NAV */}
          <div className="bottom-nav">
            {tabs.map(t => (
              <div 
                key={t.id} 
                className={"nav-item" + (tab === t.id ? " active" : "")}
                onClick={() => setTab(t.id)}
              >
                <i className={"fas " + t.icon} />
                <span>{t.label}</span>
              </div>
            ))}
          </div>

          {iframeUrl && (
            <div className="iframe-overlay">
              <div className="iframe-bar">
                <span style={{ fontWeight: 600 }}>Offer Wall</span>
                <button onClick={() => { setIframeUrl(null); refreshBalance(); }}><i className="fas fa-times" /></button>
              </div>
              <iframe src={iframeUrl} title="Offerwall" sandbox="allow-scripts allow-forms allow-popups allow-same-origin allow-top-navigation-by-user-activation" />
            </div>
          )}

          {modal && (
            <div className="modal-overlay" onClick={e => e.target === e.currentTarget && closeModal()}>
              <div className="modal">
                <div className="modal-header">
                  <h3>{modal.name}</h3>
                  <button className="modal-close" onClick={closeModal}><i className="fas fa-times" /></button>
                </div>
                <div className="steps">
                  <div className={"step-dot" + (step > 1 ? " done" : step === 1 ? " active" : "")} />
                  <div className={"step-dot" + (step > 2 ? " done" : step === 2 ? " active" : "")} />
                  <div className={"step-dot" + (step === 3 ? " active" : "")} />
                </div>
                {step === 1 && (
                  <>
                    <label>Amount (USD)</label>
                    <input type="number" step="0.01" min={modal.min} max={user && user.balance}
                      value={amount} onChange={e => setAmount(e.target.value)}
                      placeholder={"Min $" + modal.min} autoFocus />
                    <p style={{ fontSize: "0.8rem", color: "var(--muted)", marginBottom: 16 }}>
                      Available: ${parseFloat((user && user.balance) || 0).toFixed(2)}
                    </p>
                    <button className="btn btn-primary" onClick={nextStep}>Next</button>
                  </>
                )}
                {step === 2 && (
                  <>
                    <label>{modal.detailsLabel}</label>
                    <input value={details} onChange={e => setDetails(e.target.value)}
                      placeholder={modal.detailsPlaceholder} autoFocus />
                    <div className="btn-row">
                      <button className="btn btn-ghost" onClick={() => setStep(1)}>Back</button>
                      <button className="btn btn-primary" onClick={nextStep}>Next</button>
                    </div>
                  </>
                )}
                {step === 3 && (
                  <>
                    <div className="summary">
                      <div><strong>Reward:</strong> {modal.name}</div>
                      <div><strong>Amount:</strong> ${parseFloat(amount || 0).toFixed(2)}</div>
                      <div><strong>Details:</strong> {details}</div>
                    </div>
                    <div className="btn-row">
                      <button className="btn btn-ghost" onClick={() => setStep(2)} disabled={submitting}>Back</button>
                      <button className="btn btn-primary" onClick={submitCashout} disabled={submitting}>
                        {submitting ? "Submitting..." : "Submit"}
                      </button>
                    </div>
                  </>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
