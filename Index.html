
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>RewardBux</title>
  <meta name="theme-color" content="#0f1419" />
  <link rel="icon" href="https://i.imgur.com/wppiqAy.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    :root {
      --bg: #0f1419;
      --bg-elevated: #161b22;
      --bg-card: #1c222b;
      --bg-hover: #242b36;
      --border: #2a3340;
      --border-light: #343e4d;
      --text: #e6edf3;
      --text-secondary: #9ba7b4;
      --text-muted: #6e7a88;
      --accent: #14b8a6;
      --accent-hover: #0d9488;
      --accent-soft: rgba(20, 184, 166, 0.12);
      --accent-glow: rgba(20, 184, 166, 0.25);
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
      --radius: 12px;
      --radius-sm: 8px;
      --radius-xs: 6px;
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.25);
      --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.4);
      --font: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
      line-height: 1.5;
      min-height: 100vh;
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
    }

    .app {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 16px 80px;
    }

    /* ========== HEADER ========== */
    .top-header {
      background: rgba(15, 20, 25, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 40;
      padding: 0 16px;
    }

    .header-row {
      display: flex;
      align-items: center;
      gap: 16px;
      min-height: 56px;
      max-width: 960px;
      margin: 0 auto;
    }

    .logo {
      font-weight: 700;
      font-size: 1.25rem;
      letter-spacing: -0.4px;
      display: flex;
      align-items: center;
      gap: 2px;
      color: #fff;
      flex-shrink: 0;
    }
    .logo .dollar { color: var(--accent); }
    .logo span { color: #5eead4; }

    .header-nav {
      display: flex;
      align-items: center;
      gap: 4px;
      flex: 1;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .header-nav::-webkit-scrollbar { display: none; }

    .header-nav .nav-item {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 8px 14px;
      color: var(--text-secondary);
      font-size: 0.8125rem;
      font-weight: 500;
      cursor: pointer;
      border-radius: 999px;
      white-space: nowrap;
      transition: all 0.15s ease;
    }
    .header-nav .nav-item i { font-size: 0.9rem; opacity: 0.9; }
    .header-nav .nav-item:hover {
      color: var(--text);
      background: var(--bg-hover);
    }
    .header-nav .nav-item.active {
      color: var(--accent);
      background: var(--accent-soft);
    }
    .header-nav .nav-item.active i { color: var(--accent); }

    .header-user {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      margin-left: auto;
      position: relative;
    }

    .avatar-wrap {
      position: relative;
      width: 36px;
      height: 36px;
      flex-shrink: 0;
      cursor: pointer;
    }
    .avatar-wrap img {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      object-fit: cover;
      border: 1.5px solid var(--border);
      transition: border-color 0.15s;
    }
    .avatar-wrap:hover img { border-color: var(--accent); }

    .level-badge {
      position: absolute;
      bottom: -3px;
      right: -4px;
      background: var(--accent);
      color: #042f2e;
      font-size: 0.6rem;
      font-weight: 700;
      width: 16px;
      height: 16px;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1.5px solid var(--bg);
    }

    .user-meta {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .user-meta .name {
      font-weight: 600;
      font-size: 0.8125rem;
      color: #fff;
      line-height: 1.2;
    }
    .user-meta .balance-row {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.75rem;
    }
    .user-meta .balance-row .diamond { color: #fbbf24; }
    .user-meta .balance-row .amount {
      color: var(--accent);
      font-weight: 600;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.875rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .icon-btn:hover {
      background: var(--bg-hover);
      color: var(--text);
      border-color: var(--border-light);
    }
    .icon-btn.logout:hover {
      background: rgba(239, 68, 68, 0.12);
      border-color: rgba(239, 68, 68, 0.35);
      color: var(--danger);
    }

    /* Dropdown */
    .dropdown-menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      min-width: 210px;
      box-shadow: var(--shadow-lg);
      z-index: 50;
      overflow: hidden;
      padding: 6px;
    }
    .dropdown-menu .menu-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      font-size: 0.8125rem;
      color: var(--text);
      cursor: pointer;
      border: none;
      background: transparent;
      width: 100%;
      font-family: inherit;
      border-radius: var(--radius-sm);
      transition: background 0.12s;
    }
    .dropdown-menu .menu-item:hover {
      background: var(--bg-hover);
    }
    .dropdown-menu .menu-item i {
      width: 18px;
      color: var(--text-muted);
    }
    .dropdown-menu .menu-item:hover i { color: var(--accent); }
    .dropdown-menu .menu-divider {
      height: 1px;
      background: var(--border);
      margin: 4px 6px;
    }

    /* Logs bar */
    .logs-bar {
      background: var(--bg-elevated);
      border-top: 1px solid var(--border);
      padding: 8px 12px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .logs-bar::-webkit-scrollbar { display: none; }
    .logs-row { display: flex; gap: 8px; width: max-content; }

    .log-card {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 6px 10px 6px 6px;
      min-width: 140px;
      flex-shrink: 0;
      transition: border-color 0.15s;
    }
    .log-card:hover { border-color: var(--border-light); }
    .log-card img {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      object-fit: cover;
    }
    .log-card .info {
      display: flex;
      flex-direction: column;
      line-height: 1.25;
      overflow: hidden;
    }
    .log-card .uname {
      font-size: 0.7rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 90px;
    }
    .log-card .amount {
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--accent);
    }

    /* ========== MAIN ========== */
    main {
      padding: 20px 0 24px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
    }
    .card h2 {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 14px;
      color: #fff;
      letter-spacing: -0.2px;
    }

    /* Hero */
    .hero {
      text-align: center;
      padding: 28px 12px 20px;
    }
    .hero h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.3;
      margin-bottom: 10px;
      letter-spacing: -0.4px;
    }
    .hero h1 span { color: var(--accent); }
    .hero p {
      color: var(--text-secondary);
      font-size: 0.9375rem;
      max-width: 420px;
      margin: 0 auto;
    }

    .feature-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin: 20px 0;
    }
    @media (max-width: 600px) {
      .feature-grid { grid-template-columns: 1fr; }
    }

    .feature-card {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 14px;
      text-align: center;
      transition: all 0.2s ease;
    }
    .feature-card:hover {
      border-color: var(--border-light);
      background: var(--bg-hover);
      transform: translateY(-2px);
    }
    .feature-card h3 {
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--text);
    }
    .feature-card h3 span { color: var(--accent); }
    .feature-card .icons {
      display: flex;
      justify-content: center;
      gap: 14px;
      font-size: 1.35rem;
      color: var(--text-secondary);
    }

    .section-divider {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin: 24px 0 12px;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 11px 18px;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 0.875rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-primary {
      background: var(--accent);
      color: #042f2e;
    }
    .btn-primary:hover {
      background: var(--accent-hover);
      box-shadow: 0 4px 16px var(--accent-glow);
    }
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
    }
    .btn-success { background: var(--success); color: #fff; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-ghost {
      background: transparent;
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover {
      background: var(--bg-hover);
      color: var(--text);
      border-color: var(--border-light);
    }

    /* Forms */
    input, select, textarea {
      width: 100%;
      padding: 11px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.875rem;
      font-family: inherit;
      margin-bottom: 12px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    input::placeholder { color: var(--text-muted); }
    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 6px;
      letter-spacing: 0.2px;
    }

    /* Offer / Reward grids */
    .offer-grid, .reward-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
      gap: 12px;
    }
    .offer, .reward-item {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 12px;
      text-align: center;
      transition: all 0.18s ease;
    }
    .reward-item { cursor: pointer; }
    .reward-item:hover {
      border-color: var(--accent);
      background: var(--bg-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
    }
    .offer img, .reward-item img {
      height: 32px;
      max-width: 100%;
      object-fit: contain;
      margin-bottom: 10px;
    }
    .reward-item .name {
      font-weight: 600;
      font-size: 0.8125rem;
      color: var(--text);
    }
    .reward-item .min {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 3px;
    }
    .reward-item .tag {
      display: inline-block;
      margin-top: 8px;
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
    }

    /* CR toolbar */
    .cr-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 14px;
      align-items: flex-end;
    }
    .cr-toolbar .field { flex: 1; min-width: 130px; }
    .cr-toolbar .field label { margin-bottom: 5px; }
    .cr-toolbar .field input,
    .cr-toolbar .field select { margin-bottom: 0; }
    .cr-toolbar .field-btn { flex: 0 0 auto; }

    .denom-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 10px 0 16px;
    }
    .denom-chip {
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.8125rem;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s ease;
    }
    .denom-chip:hover { border-color: var(--accent); color: var(--accent); }
    .denom-chip.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
    }

    .brand-back {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 14px;
      color: var(--text-secondary);
      font-size: 0.8125rem;
      font-weight: 500;
      cursor: pointer;
      background: none;
      border: none;
      font-family: inherit;
      padding: 0;
      transition: color 0.15s;
    }
    .brand-back:hover { color: var(--accent); }

    .cr-count {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin: 4px 0 12px;
    }

    .section-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      letter-spacing: 0.6px;
      margin: 18px 0 12px;
      text-transform: uppercase;
      font-weight: 500;
    }

    /* History / Logs */
    .log-item, .history-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.8125rem;
    }
    .log-item:last-child, .history-item:last-child { border-bottom: none; }
    .log-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--accent-soft);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      flex-shrink: 0;
    }
    .history-item { justify-content: space-between; }

    /* Leaderboard */
    .leaderboard table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8125rem;
    }
    .leaderboard th {
      text-align: left;
      padding: 8px 6px;
      color: var(--text-muted);
      font-weight: 500;
      border-bottom: 1px solid var(--border);
      font-size: 0.75rem;
      letter-spacing: 0.3px;
    }
    .leaderboard td {
      padding: 10px 6px;
      border-bottom: 1px solid var(--border);
    }
    .leaderboard tr:last-child td { border-bottom: none; }

    /* Captcha */
    .captcha {
      background: var(--bg);
      border: 1px dashed var(--border);
      border-radius: var(--radius-sm);
      padding: 12px;
      text-align: center;
      font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace;
      font-size: 1.25rem;
      letter-spacing: 6px;
      margin-bottom: 12px;
      user-select: none;
      color: var(--accent);
      font-weight: 600;
    }

    /* Alerts */
    .alert {
      padding: 11px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.8125rem;
      margin-bottom: 14px;
      font-weight: 500;
    }
    .alert-warn {
      background: rgba(245, 158, 11, 0.1);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.25);
    }
    .alert-error {
      background: rgba(239, 68, 68, 0.1);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.25);
    }
    .alert-success {
      background: rgba(34, 197, 94, 0.1);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.25);
    }
    .alert-info {
      background: var(--accent-soft);
      color: #5eead4;
      border: 1px solid rgba(20, 184, 166, 0.25);
    }

    .divider {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.75rem;
      margin: 16px 0;
      position: relative;
    }
    .divider::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 1px;
      background: var(--border);
      z-index: 0;
    }
    .divider span {
      background: var(--bg-card);
      padding: 0 14px;
      position: relative;
      z-index: 1;
    }

    /* Chat */
    .chat-box {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 140px);
      min-height: 320px;
    }

    .chat-panel {
      position: fixed;
      top: 0;
      right: 0;
      width: 380px;
      max-width: 92vw;
      height: 100vh;
      background: var(--bg-elevated);
      border-left: 1px solid var(--border);
      z-index: 160;
      display: flex;
      flex-direction: column;
      box-shadow: -12px 0 40px rgba(0, 0, 0, 0.45);
      animation: chatSlideIn 0.22s ease forwards;
    }
    @keyframes chatSlideIn {
      from { transform: translateX(100%); }
      to { transform: translateX(0); }
    }
    .chat-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 16px 14px;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      font-size: 0.9375rem;
      color: #fff;
      flex-shrink: 0;
    }
    .chat-panel-header i { color: var(--accent); margin-right: 8px; }
    .chat-panel-close {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      width: 32px;
      height: 32px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }
    .chat-panel-close:hover {
      color: var(--text);
      background: var(--bg-hover);
      border-color: var(--accent);
    }
    .chat-panel-messages {
      flex: 1;
      overflow-y: auto;
      margin: 0 12px 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg);
    }
    .chat-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 150;
      backdrop-filter: blur(2px);
    }
    @media (max-width: 768px) {
      .chat-panel { width: 100%; max-width: 100%; }
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 6px 0;
      margin-bottom: 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg);
    }
    .chat-msg {
      padding: 8px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 0.8125rem;
      word-break: break-word;
    }
    .chat-msg:last-child { border-bottom: none; }
    .chat-msg.admin-msg {
      background: rgba(245, 158, 11, 0.08);
      border-radius: var(--radius-xs);
      border-bottom: none;
      margin: 4px 8px;
    }
    .chat-msg .meta {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-bottom: 2px;
      display: flex;
      justify-content: space-between;
    }
    .chat-msg .meta .name {
      color: var(--accent);
      font-weight: 600;
    }
    .badge-owner {
      display: inline-flex;
      align-items: center;

function normalizeCRBrands(raw) {
  if (!raw) return [];
  let list = raw;
  if (Array.isArray(raw)) list = raw;
  else if (raw && typeof raw === "object") {
    if (Array.isArray(raw.brands)) list = raw.brands;
    else if (Array.isArray(raw.data)) list = raw.data;
    else if (Array.isArray(raw.items)) list = raw.items;
    else if (Array.isArray(raw.results)) list = raw.results;
    else if (Array.isArray(raw.families)) list = raw.families;
    else {
      const out = [];
      Object.keys(raw).forEach(k => {
        const v = raw[k];
        if (Array.isArray(v)) { v.forEach(x => out.push(x)); }
        else if (v && typeof v === "object") {
          if (v.name || v.brand_name || v.family_name || v.title || v.logo_url) out.push(v);
          else {
            Object.keys(v).forEach(k2 => {
              const v2 = v[k2];
              if (Array.isArray(v2)) v2.forEach(x => out.push(x));
              else if (v2 && typeof v2 === "object" && (v2.name || v2.brand_name)) out.push(v2);
            });
          }
        }
      });
      list = out;
    }
  }
  if (!Array.isArray(list)) return [];
  const seen = {};
  const result = [];
  list.forEach((b, i) => {
    if (!b || typeof b !== "object") return;
    const name = String(b.name || b.brand_name || b.family_name || b.title || b.brand || "").trim();
    if (!name || /^brand\s*\d+$/i.test(name)) return;
    const family = String(b.family_name || b.brand_name || b.name || name).trim();
    const key = family.toLowerCase();
    if (seen[key]) return;
    seen[key] = true;
    let logo = b.logo_url || b.logo || b.image || "";
    if (!logo && b.logo_base_url) logo = String(b.logo_base_url) + ".webp";
    result.push({
      id: String(b.id || b.slug || family) + "_" + i,
      name, family_name: family, brand_name: String(b.brand_name || family || name).trim(),
      logo, country_code: b.country_code || "", raw: b
    });
  });
  result.sort((a, b) => a.name.localeCompare(b.name));
  return result;
}

function normalizeCRProducts(raw, brandName) {
  if (!raw) return { fixed: [], ranges: [] };
  let list = raw;
  if (raw.products) list = raw.products;
  if (raw.data) list = raw.data;
  if (raw.items) list = raw.items;
  if (!Array.isArray(list) && typeof list === "object") {
    if (raw.denominations || raw.denomination || raw.face_values) list = [raw];
    else list = Object.values(list).filter(x => x && typeof x === "object");
  }
  if (!Array.isArray(list)) list = [];
  const fixed = [], ranges = [], seen = {};
  function addFixed(label, value, currency) {
    const v = Number(value);
    if (!isFinite(v) || v <= 0) return;
    const key = v.toFixed(2) + "|" + (currency || "");
    if (seen[key]) return;
    seen[key] = true;
    fixed.push({
      label: label || (currency ? (currency + " " + v) : ("$" + v)),
      value: v, denomination: label || (v + " " + (currency || "USD")), currency: currency || "USD"
    });
  }
  list.forEach(p => {
    const dens = p.denominations || p.denomination_list || p.face_values || p.values || p.amounts || [];
    if (Array.isArray(dens)) {
      dens.forEach(d => {
        if (d == null) return;
        if (typeof d === "number" || typeof d === "string") {
          const num = parseFloat(String(d).replace(/[^0-9.]/g, ""));
          addFixed(String(d), num, p.currency || "USD");
        } else if (typeof d === "object") {
          const num = parseFloat(d.value || d.face_value || d.amount || d.denomination || 0);
          const lab = d.label || d.denomination || d.localized || (d.currency ? (d.currency + " " + num) : null);
          addFixed(lab, num, d.currency || p.currency || "USD");
        }
      });
    }
    if (p.denomination && typeof p.denomination === "string" && p.denomination.toLowerCase() !== "range") {
      const num = parseFloat(String(p.denomination).replace(/[^0-9.]/g, ""));
      addFixed(p.denomination, num, p.currency || "USD");
    }
    if (p.face_value || p.value || p.amount) {
      const num = parseFloat(p.face_value || p.value || p.amount);
      addFixed(null, num, p.currency || "USD");
    }
    const isRange = String(p.denomination || p.type || p.kind || "").toLowerCase().indexOf("range") >= 0
      || p.min_value != null || p.max_value != null || p.min != null || p.max != null;
    if (isRange) {
      ranges.push({
        min: Number(p.min_value || p.min || 1) || 1,
        max: Number(p.max_value || p.max || 500) || 500,
        currency: p.currency || "USD",
        brand_name: p.brand_name || brandName
      });
    }
  });
  fixed.sort((a, b) => a.value - b.value);
  return { fixed, ranges };
}

const PTS_PER_USD = 1000;
function toUSD(pts) {
  const n = Number(pts);
  return isFinite(n) ? (n / PTS_PER_USD).toFixed(2) : "0.00";
}
function toPts(usd) {
  const n = Number(usd);
  return isFinite(n) ? Math.round(n * PTS_PER_USD) : 0;
}
function formatUSD(pts) {
  return "$" + toUSD(pts);
}
function formatAmountUSD(amount, isPoints = true) {
  if (!amount) return "0.00";
  const num = parseFloat(amount);
  if (isNaN(num)) return "0.00";
  if (isPoints && num >= 100) return (num / PTS_PER_USD).toFixed(2);
  if (!isPoints && num < 100) return num.toFixed(2);
  if (num >= 100) return (num / PTS_PER_USD).toFixed(2);
  return num.toFixed(2);
}

let audioCtx = null;
function playDing() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type = "sine";
    osc.frequency.setValueAtTime(880, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.15);
    gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
    osc.start(); osc.stop(audioCtx.currentTime + 0.35);
  } catch (e) {}
}

async function api(action, params = {}) {
  try {
    const qs = new URLSearchParams(Object.assign({ action }, params)).toString();
    const res = await fetch(SCRIPT_URL + "?" + qs);
    return await res.json();
  } catch (e) { return { error: "Network error" }; }
}
async function postApi(action, body = {}) {
  try {
    const params = new URLSearchParams();
    params.append("action", action);
    Object.keys(body).forEach(k => params.append(k, body[k]));
    const res = await fetch(SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8" },
      body: params.toString()
    });
    return await res.json();
  } catch (e) { return { error: "Network error" }; }
}

    if (!list.length) setCrBrandsError("No brands returned.");
  }, [crCountry]);

  const openCRBrand = useCallback(async (brand) => {
    if (!user) { showMsg("Please login first"); setTab("earn"); return; }
    setCrSelectedBrand(brand);
    setCrDenoms({ fixed: [], ranges: [] });
    setCrSelectedDenom(null);
    setCrCustomAmount("");
    if (user.email) setDetails(String(user.email));
    setCrDenomsLoading(true);
    const data = await api("getCRProducts", {
      country: crCountry, country_code: crCountry,
      family_name: brand.family_name || brand.brand_name || brand.name,
      brand_name: brand.brand_name || brand.family_name || brand.name,
      coin: "USDC", lang: "en"
    });
    setCrDenomsLoading(false);
    if (data.error) { showMsg(data.error); setCrDenoms({ fixed: [], ranges: [] }); return; }
    const norm = normalizeCRProducts(data.products, brand.brand_name || brand.name);
    setCrDenoms(norm);
    if (!norm.fixed.length && !norm.ranges.length) {
      setCrDenoms({ fixed: [], ranges: [{ min: 1, max: 500, currency: "USD", brand_name: brand.name }] });
    }
  }, [user, crCountry]);

  const loadChat = useCallback(async (isInitial) => {
    const data = await api("getChat", { limit: 50 });
    if (!data.messages) return;
    const msgs = data.messages;
    const newestId = msgs.length ? msgs[msgs.length - 1].id : null;
    if (!isInitial && newestId && lastMsgId.current && newestId !== lastMsgId.current && soundRef.current) playDing();
    lastMsgId.current = newestId;
    setChatMessages(msgs);
  }, []);

  const creditEarnings = useCallback(async (userId, amt, txnId) => {
    const pts = toPts(amt);
    const data = await postApi("creditEarnings", { userId, amount: pts, transactionId: txnId || String(Date.now()) });
    if (data.error) { showMsg("Credit failed: " + data.error); return; }
    showMsg(formatUSD(pts) + " credited!", "success");
    const u = userRef.current;
    if (u && (String(u.account) === String(userId) || u.username === userId)) refreshBalance();
    loadLogs(); loadLeaders();
    if (soundRef.current) playDing();
  }, [refreshBalance, loadLogs, loadLeaders]);

  const handleGoogleCredential = useCallback((response) => {
    if (!response || !response.credential) { showMsg("Google login failed"); return; }
    let payload;
    try {
      payload = JSON.parse(decodeURIComponent(escape(atob(response.credential.split(".")[1].replace(/-/g, "+").replace(/_/g, "/")))));
    } catch (e) { showMsg("Could not read Google account"); return; }
    setLoggingIn(true);
    postApi("googleLogin", {
      googleId: payload.sub, email: payload.email, name: payload.name || "", picture: payload.picture || ""
    }).then(data => {
      setLoggingIn(false);
      if (data.error) { showMsg(data.error); return; }
      saveUser(data.user);
      setTab("earn");
      showMsg(data.isNew ? "Account created! Welcome!" : "Welcome back!", "success");
    });
  }, []);

  useEffect(() => {
    if (user) return;
    let tries = 0;
    const timer = setInterval(() => {
      tries++;
      const el = document.getElementById("gbtn");
      const g = window.google && window.google.accounts && window.google.accounts.id;
      if (g && el) {
        clearInterval(timer);
        try {
          if (!gInited.current) {
            g.initialize({ client_id: GOOGLE_CLIENT_ID, callback: handleGoogleCredential, cancel_on_tap_outside: true });
            gInited.current = true;
          }
          el.innerHTML = "";
          g.renderButton(el, { theme: "filled_blue", size: "large", width: 320, text: "continue_with", shape: "pill", logo_alignment: "left" });
        } catch (e) {}
      } else if (tries > 40) clearInterval(timer);
    }, 250);
    return () => clearInterval(timer);
  }, [tab, user, handleGoogleCredential]);

  useEffect(() => {
    const saved = storage.get("buxiq_user");
    if (saved) { try { const u = JSON.parse(saved); setUser(u); userRef.current = u; } catch (e) {} }
    const soundPref = storage.get("buxiq_sound");
    if (soundPref !== null) { setSoundOn(soundPref === "1"); soundRef.current = soundPref === "1"; }
    genCaptcha();
    loadLeaders(); loadLogs(); loadOfferwalls();
    const p = new URLSearchParams(window.location.search);
    const uid = p.get("user_id") || p.get("userid");
    const amt = p.get("amount") || p.get("reward");
    const txn = p.get("transaction_id") || p.get("txn_id");
    if (uid && amt && !isNaN(parseFloat(amt))) {
      creditEarnings(uid, parseFloat(amt), txn);
      window.history.replaceState({}, document.title, window.location.pathname);
    }
  }, []);

  useEffect(() => {
    if (chatOpen || tab === "chat") {
      loadChat(true);
      pollRef.current = setInterval(() => loadChat(false), 4000);
    }
    return () => clearInterval(pollRef.current);
  }, [chatOpen, tab, loadChat]);
  useEffect(() => {
    if (tab === "shop" && user) loadCashouts(user.account);
  }, [tab, user, loadCashouts]);
  useEffect(() => {
    if (tab === "shop" && user) loadCRBrands(crCountry);
  }, [tab, user, crCountry]);
  useEffect(() => { if (tab === "earn") loadOfferwalls(); }, [tab, loadOfferwalls]);
  useEffect(() => { if (chatEndRef.current) chatEndRef.current.scrollIntoView({ behavior: "smooth" }); }, [chatMessages]);

  useEffect(() => {
    function handleClickOutside(e) {
      if (dropdownRef.current && !dropdownRef.current.contains(e.target)) {
        setDropdownOpen(false);
      }
    }
    document.addEventListener("mousedown", handleClickOutside);
    return () => document.removeEventListener("mousedown", handleClickOutside);
  }, []);

  async function handleLogin() {
    if (!form.account || !form.clientId) { showMsg("Enter account and client ID"); return; }
    if (form.captcha.trim() !== captcha) { showMsg("Invalid CAPTCHA"); genCaptcha(); setForm({...form, captcha: ""}); return; }
    setLoggingIn(true);
    const data = await api("login", { account: form.account, clientId: form.clientId });
    setLoggingIn(false);
    if (data.error) { showMsg(data.error); genCaptcha(); return; }
    saveUser(data.user);
    setTab("earn");
    showMsg("Welcome back!", "success");
  }

  async function sendChat() {
    const text = chatInput.trim();
    if (!text) return;
    if (!user) { showMsg("Please login to chat"); setTab("earn"); return; }
    if (text.length > 300) { showMsg("Message too long (max 300)"); return; }
    setChatInput("");
    const data = await postApi("sendChat", {
      account: user.account, username: user.username || user.account, message: text
    });
    if (data.error) { showMsg(data.error); return; }
    loadChat(false);
  }

  function openModal(reward) {
    if (!user) { showMsg("Please login first"); setTab("earn"); return; }
    setModal(reward); setStep(1); setAmount("");
    setDetails((user.email || "").trim());
  }
  function closeModal() { setModal(null); setStep(1); setAmount(""); setDetails(""); }

  function nextStep() {
    const balPts = Number((user && user.balance) || 0);
    const amtUsd = parseFloat(amount);
    if (step === 1) {
      if (!amount || isNaN(amtUsd) || amtUsd <= 0) { showMsg("Enter a valid amount"); return; }
      if (amtUsd < modal.min) { showMsg("Minimum is $" + modal.min); return; }
      const amtPts = toPts(amtUsd);
      if (amtPts > balPts) { showMsg("Insufficient balance"); return; }
      setStep(2);
    } else if (step === 2) {
      if (!details.trim()) { showMsg("Enter receiving details"); return; }
      if (modal.provider === "cryptorefills" && details.indexOf("@") < 0) { showMsg("Enter valid email"); return; }
      setStep(3);
    }
  }

  async function submitCashout() {
    setSubmitting(true);
    const amtUsd = parseFloat(amount);
    const amtPts = toPts(amtUsd);
    const isCR = modal.provider === "cryptorefills";
    let data;
    if (isCR) {
      let clientIp = "";
      try {
        const ipRes = await fetch("https://api.ipify.org?format=json");
        const ipJson = await ipRes.json();
        if (ipJson && ipJson.ip) clientIp = String(ipJson.ip);
      } catch (e) {}
      data = await postApi("submitCRCashout", {
        account: user.account, username: user.username || user.account,
        brand_name: modal.brand_name || modal.name,
        country_code: modal.country_code || "US",
        amountUsd: amtUsd.toFixed(2), amount: amtPts,
        details: details.trim(), email: details.trim(),
        coin: "USDC", network: "Solana", ip: clientIp,
        userAgent: (typeof navigator !== "undefined" && navigator.userAgent) ? navigator.userAgent : "RewardBux"
      });
    } else {
      data = await postApi("submitCashout", {
        account: user.account, username: user.username || user.account,
        rewardType: modal.id, rewardName: modal.name,
        amount: amtPts, amountUsd: amtUsd.toFixed(2), details: details.trim()
      });
    }
    setSubmitting(false);
    if (data.error) { showMsg(data.error + (data.refunded ? " (balance refunded)" : "")); return; }
    showMsg(isCR ? ("Gift card order submitted! Email: " + details.trim()) : "Cashout submitted!", "success");
    const newBal = data.newBalance !== undefined ? data.newBalance : (Number(user.balance) - amtPts);
    saveUser({ ...user, balance: newBal });
    loadCashouts(user.account);
    closeModal();
  }

  async function refreshPendingCR() {
    if (!user) return;
    setRefreshingCR(true);
    const data = await api("refreshCRCashouts", { account: user.account });
    setRefreshingCR(false);
    if (data.error) { showMsg(data.error); return; }
    showMsg("Updated " + (data.updated || 0) + " order(s)", "success");
    loadCashouts(user.account);
  }

  function statusBadge(status) {
    const s = String(status || "unsent").toLowerCase();
    if (s === "sent") return <span className="badge badge-sent">Sent</span>;
    if (s === "pending") return <span className="badge badge-pending">Pending</span>;
    return <span className="badge badge-unsent">Unsent</span>;
  }

  async function redeemBonus() {
    if (!user) { showMsg("Please login first", "error"); setTab("earn"); return; }
    const code = (form.bonusCode || "").trim();
    if (!code) { showMsg("Please enter a bonus code", "error"); return; }
    const data = await api("redeemBonus", { account: user.account, username: user.username || user.account, bonusCode: code });
    if (data.error) { showMsg(data.error, "error"); return; }
    showMsg("Successfully redeemed $" + data.amountUsd + " USD!", "success");
    setForm(f => ({ ...f, bonusCode: "" }));
    if (data.newBalance) { saveUser({ ...user, balance: data.newBalance }); }
    else { refreshBalance(); }
  }

  function openOffer(ow) {
    if (!user) { showMsg("Please login first"); setTab("earn"); return; }
    const uid = String(user.account || user.username || "");
    const uname = String(user.username || uid);
    let url = String(ow.urlTemplate || "");
    if (!url) { showMsg("Offerwall URL missing"); return; }
    url = url.replace(/\{user\}/gi, encodeURIComponent(uid)).replace(/\{userid\}/gi, encodeURIComponent(uid))
             .replace(/\{user_id\}/gi, encodeURIComponent(uid)).replace(/\{account\}/gi, encodeURIComponent(uid))
             .replace(/\{username\}/gi, encodeURIComponent(uname));
    url += (url.indexOf("?") !== -1 ? "&" : "?") + "t=" + Date.now();
    setIframeUrl(url);
  }

  function selectTab(id) {
    if (id === "chat") { setChatOpen(prev => !prev); return; }
    setChatOpen(false);
    setTab(id);
  }

  function toggleDropdown() {
    if (!user) {
      setTab("earn");
      return;
    }
    setDropdownOpen(prev => !prev);
  }

  const tabs = [
    { id: "home", icon: "fa-home", label: "Home" },
    { id: "earn", icon: "fa-hand-holding-dollar", label: "Earn" },
    { id: "shop", icon: "fa-shopping-cart", label: "Shop" },
    { id: "leaders", icon: "fa-trophy", label: "Leaders" },
    { id: "chat", icon: "fa-comments", label: "Chat" },
    { id: "bonus", icon: "fa-gift", label: "Bonus" },
    { id: "help", icon: "fa-circle-question", label: "Help" }
  ];

  return (
    <div className="app">
      {/* HEADER */}
      <div className="top-header">
        <div className="header-row">
          <div className="logo"><span className="dollar">$</span>Reward<span>Bux</span></div>
          <div className="header-nav">
            {tabs.map(t => (
              <div key={t.id} className={"nav-item" + ((t.id === "chat" ? chatOpen : tab === t.id) ? " active" : "")} onClick={() => selectTab(t.id)}>
                <i className={"fas " + t.icon} /><span>{t.label}</span>
              </div>
            ))}
          </div>
          <div className="header-user" ref={dropdownRef}>
            {user ? (
              <>
                <div className="avatar-wrap" onClick={toggleDropdown}>
                  <img src={user.avatar || ("https://ui-avatars.com/api/?name=" + encodeURIComponent(user.username || "U") + "&background=0d9488&color=fff")} alt="" />
                  <div className="level-badge">{user.level || 1}</div>
                </div>
                <div className="user-meta">
                  <div className="name">{user.username || user.account || "User"}</div>
                  <div className="balance-row"><span className="diamond"><i className="fas fa-gem"></i></span><span className="amount">{formatUSD(user.balance || 0)}</span></div>
                </div>
                <button className="icon-btn logout" onClick={logout} title="Logout"><i className="fas fa-sign-out-alt"></i></button>
                {dropdownOpen && (
                  <div className="dropdown-menu">
                    <button className="menu-item" onClick={() => { setDropdownOpen(false); setTab("history"); }}><i className="fas fa-clock-rotate-left"></i> Cashout History</button>
                    <button className="menu-item" onClick={() => { setDropdownOpen(false); setTab("leaders"); }}><i className="fas fa-trophy"></i> Leaderboard</button>
                    <button className="menu-item" onClick={() => { setDropdownOpen(false); setTab("bonus"); }}><i className="fas fa-gift"></i> Bonus Codes</button>
                    <div className="menu-divider"></div>
                    <button className="menu-item" onClick={() => { setDropdownOpen(false); logout(); }}><i className="fas fa-sign-out-alt"></i> Logout</button>
                  </div>
                )}
              </>
            ) : (
              <button className="btn btn-primary" style={{ width: "auto", padding: "8px 16px", fontSize: "0.8125rem" }} onClick={() => setTab("earn")}>Signup / Login</button>
            )}
          </div>
        </div>
        {logs.length > 0 && (
          <div className="logs-bar"><div className="logs-row">
            {logs.slice(0, 15).map((l, i) => (
              <div key={i} className="log-card">
                <img src={"https://ui-avatars.com/api/?name=" + encodeURIComponent(l.username || "U") + "&background=0d9488&color=fff&size=64"} alt="" />
                <div className="info"><span className="uname">{l.username}</span><span className="amount">{formatUSD(l.amount || 0)}</span></div>
              </div>
            ))}
          </div></div>
        )}
      </div>

      <main>
        {msg && <div className={"alert alert-" + msg.type}>{msg.text}</div>}

        {tab === "home" && (
          <>
            <div className="hero">
              <h1>Earn free rewards — <span>crypto, PayPal & gift cards</span></h1>
              <p>Thousands of members cash out every day. Start in minutes.</p>
            </div>
            <div className="feature-grid">
              <div className="feature-card"><h3>Take <span>Surveys</span></h3><div className="icons"><i className="fas fa-list-check"></i><i className="fas fa-pen-to-square"></i></div></div>
              <div className="feature-card"><h3>Try <span>Apps</span></h3><div className="icons"><i className="fas fa-mobile-screen"></i><i className="fas fa-download"></i></div></div>
              <div className="feature-card"><h3>Play <span>Games</span></h3><div className="icons"><i className="fas fa-gamepad"></i><i className="fas fa-trophy"></i></div></div>
            </div>
            <div className="section-divider">Cash out with</div>
            <div className="feature-grid">
              <div className="feature-card"><h3>Crypto <span>Payouts</span></h3><div className="icons"><i className="fab fa-bitcoin"></i><i className="fab fa-ethereum"></i></div></div>
              <div className="feature-card"><h3>PayPal <span>Cash</span></h3><div className="icons"><i className="fab fa-paypal"></i><i className="fas fa-wallet"></i></div></div>
              <div className="feature-card"><h3>Gift <span>Cards</span></h3><div className="icons"><i className="fas fa-gift"></i><i className="fas fa-store"></i></div></div>
            </div>
            {!user && <button className="btn btn-primary" style={{ marginTop: 20 }} onClick={() => setTab("earn")}><i className="fas fa-right-to-bracket" /> Login to Start Earning</button>}
          </>
        )}

        {tab === "earn" && (!user ? (
          <div className="card">
            <h2>Login</h2>
            <div id="gbtn" />
            <div className="divider"><span>OR</span></div>
            <label>Account #</label>
            <input value={form.account} onChange={e => setForm({...form, account: e.target.value})} placeholder="Account number" />
            <label>Client ID</label>
            <input value={form.clientId} onChange={e => setForm({...form, clientId: e.target.value})} placeholder="Client ID" />
            <label>CAPTCHA</label>
            <div className="captcha">{captcha}</div>
            <input value={form.captcha} onChange={e => setForm({...form, captcha: e.target.value})} onKeyDown={e => e.key === "Enter" && handleLogin()} placeholder="Enter CAPTCHA" />
            <button className="btn btn-primary" onClick={handleLogin} disabled={loggingIn}>{loggingIn ? "Signing in…" : "Login"}</button>
          </div>
        ) : (
          <div className="card">
            <h2>Earning Portal</h2>
            <p style={{ color: "var(--text-secondary)", marginBottom: 18, fontSize: "0.9rem" }}>Complete offers to earn rewards</p>
            {owLoading ? <div className="empty">Loading offerwalls…</div> : offerwalls.length === 0 ? <div className="empty">No offerwalls available.</div> : (
              <div className="offer-grid">
                {offerwalls.map(o => (
                  <div key={o.id} className="offer">
                    {o.logo ? <img src={o.logo} alt={o.name} onError={e => e.target.style.display="none"} /> : null}
                    <div style={{ fontSize: "0.875rem", marginBottom: 12, fontWeight: 600 }}>{o.name}</div>
                    <button className="btn btn-primary" style={{ padding: "9px" }} onClick={() => openOffer(o)}>Open</button>
                  </div>
                ))}
              </div>
            )}
          </div>
        ))}

        {tab === "shop" && (
          <div className="card">
            <h2>Cashout</h2>
            <p style={{ color: "var(--text-secondary)", marginBottom: 18, fontSize: "0.9rem" }}>
              <span className="balance-pill"><i className="fas fa-gem" style={{ fontSize: "0.8rem" }}></i> {formatUSD((user && user.balance) || 0)}</span>
              <span style={{ marginLeft: 10, fontSize: "0.75rem", color: "var(--text-muted)" }}>({Number((user && user.balance) || 0).toLocaleString()} pts)</span>
            </p>
            {!user ? (
              <button className="btn btn-primary" onClick={() => setTab("earn")}>Login to Cashout</button>
            ) : (
              <>
                <div className="section-label">Gift cards (CryptoRefills catalog)</div>
                {!crSelectedBrand ? (
                  <>
                    <div className="cr-toolbar">
                      <div className="field"><label>Country</label>
                        <select value={crCountry} onChange={e => { setCrCountry(e.target.value); setCrSearch(""); }}>
                          {CR_COUNTRIES.map(c => <option key={c.code} value={c.code}>{c.name} ({c.code})</option>)}
                        </select>
                      </div>
                      <div className="field"><label>Search brands</label>
                        <input value={crSearch} onChange={e => { setCrSearch(e.target.value); setCrBrandPage(1); }} placeholder="e.g. Amazon, Steam…" />
                      </div>
                      <div className="field-btn">
                        <button className="btn btn-ghost" style={{ width: "auto", padding: "10px 14px" }} onClick={() => loadCRBrands(crCountry)} disabled={crBrandsLoading}>
                          <i className={"fas " + (crBrandsLoading ? "fa-spinner fa-spin" : "fa-sync")} />
                        </button>
                      </div>
                    </div>
                    {crBrandsError && <div className="alert alert-error">{crBrandsError}</div>}
                    {crBrandsLoading ? <div className="empty">Loading brands for {crCountry}…</div> : (() => {
                      const q = crSearch.trim().toLowerCase();
                      const filtered = !q ? crBrands : crBrands.filter(b => (b.name + " " + b.family_name + " " + b.brand_name).toLowerCase().indexOf(q) >= 0);
                      const pageItems = filtered.slice(0, crBrandPage * CR_PAGE_SIZE);
                      return (
                        <>
                          <div className="cr-count">{filtered.length} brand{filtered.length === 1 ? "" : "s"} {q ? "matching \"" + crSearch.trim() + "\"" : ""}</div>
                          {filtered.length === 0 ? <div className="empty">No brands found.</div> : (
                            <div className="reward-grid">
                              {pageItems.map(b => (
                                <div key={b.id} className="reward-item" onClick={() => openCRBrand(b)}>
                                  {b.logo ? <img src={b.logo} alt={b.name} onError={e => { e.target.style.display = "none"; }} /> : <div style={{ height: 32, marginBottom: 10, fontSize: "1.3rem", color: "var(--accent)" }}><i className="fas fa-gift" /></div>}
                                  <div className="name">{b.name}</div><div className="tag">Select</div>
                                </div>
                              ))}
                            </div>
                          )}
                          {pageItems.length < filtered.length && <button className="btn btn-ghost" style={{ marginTop: 14 }} onClick={() => setCrBrandPage(p => p + 1)}>Show more ({filtered.length - pageItems.length} left)</button>}
                        </>
                      );
                    })()}
                  </>
                ) : (
                  <>
                    <button className="brand-back" onClick={() => { setCrSelectedBrand(null); setCrDenoms({ fixed: [], ranges: [] }); setCrSelectedDenom(null); setCrCustomAmount(""); }}>
                      <i className="fas fa-arrow-left" /> Back to brands
                    </button>
                    <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 16 }}>
                      {crSelectedBrand.logo ? <img src={crSelectedBrand.logo} alt="" style={{ height: 36, maxWidth: 90, objectFit: "contain" }} onError={e => { e.target.style.display = "none"; }} /> : null}
                      <div>
                        <div style={{ fontWeight: 600, color: "#fff", fontSize: "1rem" }}>{crSelectedBrand.name}</div>
                        <div style={{ fontSize: "0.75rem", color: "var(--text-muted)" }}>Country: {crCountry}</div>
                      </div>
                    </div>
                    {crDenomsLoading ? <div className="empty">Loading denominations…</div> : (
                      <>
                        {crDenoms.fixed.length > 0 && (
                          <><label>Choose amount</label><div className="denom-grid">
                            {crDenoms.fixed.map((d, i) => (
                              <button key={i} type="button" className={"denom-chip" + (crSelectedDenom && crSelectedDenom.value === d.value && !crCustomAmount ? " active" : "")} onClick={() => { setCrSelectedDenom(d); setCrCustomAmount(""); }}>{d.label}</button>
                            ))}
                          </div></>
                        )}
                        {(crDenoms.ranges.length > 0 || crDenoms.fixed.length === 0) && (
                          <><label>{crDenoms.fixed.length ? "Or custom amount (USD)" : "Amount (USD)"}</label>
                          <input type="number" step="0.01" min={crDenoms.ranges[0] ? crDenoms.ranges[0].min : 1} max={crDenoms.ranges[0] ? crDenoms.ranges[0].max : undefined} value={crCustomAmount} onChange={e => { setCrCustomAmount(e.target.value); setCrSelectedDenom(null); }} placeholder={crDenoms.ranges[0] ? ("Min " + crDenoms.ranges[0].min + (crDenoms.ranges[0].max ? " – max " + crDenoms.ranges[0].max : "")) : "e.g. 25"} /></>
                        )}
                        <label>Delivery email</label>
                        <input value={details} onChange={e => setDetails(e.target.value)} placeholder="you@email.com" />

            <div className="steps"><div className={"step-dot" + (step > 1 ? " done" : step === 1 ? " active" : "")} /><div className={"step-dot" + (step > 2 ? " done" : step === 2 ? " active" : "")} /><div className={"step-dot" + (step === 3 ? " active" : "")} /></div>
            {step === 1 && (<><label>Amount (USD)</label><input type="number" step="0.01" min={modal.min} max={user ? toUSD(user.balance) : undefined} value={amount} onChange={e => setAmount(e.target.value)} placeholder={"Min $" + modal.min} autoFocus /><p style={{ fontSize: "0.8125rem", color: "var(--text-muted)", marginBottom: 16 }}>Available: {formatUSD((user && user.balance) || 0)}<span style={{ marginLeft: 6 }}>({Number((user && user.balance) || 0).toLocaleString()} pts)</span></p><button className="btn btn-primary" onClick={nextStep}>Next</button></>)}
            {step === 2 && (<><label>{modal.detailsLabel}</label><input value={details} onChange={e => setDetails(e.target.value)} placeholder={modal.detailsPlaceholder} autoFocus /><div className="btn-row"><button className="btn btn-ghost" onClick={() => setStep(1)}>Back</button><button className="btn btn-primary" onClick={nextStep}>Next</button></div></>)}
            {step === 3 && (<><div className="summary"><div><strong>Reward:</strong> {modal.name}</div><div><strong>Amount:</strong> ${parseFloat(amount || 0).toFixed(2)}</div><div><strong>Details:</strong> {details}</div></div><div className="btn-row"><button className="btn btn-ghost" onClick={() => setStep(2)} disabled={submitting}>Back</button><button className="btn btn-primary" onClick={submitCashout} disabled={submitting}>{submitting ? "Submitting..." : "Submit"}</button></div></>)}
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
